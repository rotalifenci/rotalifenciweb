<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş Nedir? | Rotalı Fenci 3D Sinematik Akıllı Tahta Sunumu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #02040a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        #presentation-stage {
            width: 1920px;
            height: 1080px;
            flex-shrink: 0;
            position: relative;
            background: #060913 url('../assets/sunum5/slide_1_1_gunes_nedir_ultra.jpg') no-repeat center center / 1920px 1080px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
            transform-origin: center center;
        }

        /* Sabit Rotalı Fenci Logosu Hotspot (Sağ Üst) */
        .brand-logo-container {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 50;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .brand-logo-container:hover {
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
            transform: scale(1.05);
        }

        /* Sabit Instagram Rozeti Hotspot (Sol Alt) */
        .brand-insta-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 220px;
            height: 65px;
            border-radius: 35px;
            z-index: 50;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .brand-insta-container:hover {
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.6);
            transform: scale(1.04);
        }

        /* Akıllı Tahta Navigasyon Çubuğu (Altta Merkeze Yakın, Hiçbir Kartı Kapatmaz) */
        .fixed-nav-bar {
            position: absolute;
            bottom: 18px;
            right: 25px;
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 15, 30, 0.82);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 6px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .nav-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f1f5f9;
            width: 52px;
            height: 52px;
            border-radius: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: rgba(51, 65, 85, 1);
            color: #38bdf8;
            transform: translateY(-2px);
            border-color: #38bdf8;
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-color: #60a5fa;
            width: auto;
            padding: 0 24px;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
        }
        .counter-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            min-width: 100px;
            text-align: center;
        }

        /* Konuşma Balonu / Ses Efekti Kutusu */
        #speech-bubble {
            position: absolute;
            top: 140px;
            left: 310px;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            border-radius: 24px;
            padding: 16px 24px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            max-width: 380px;
            line-height: 1.35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.4);
            z-index: 40;
            display: none;
            animation: bubblePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 40px;
            border-width: 14px 14px 0;
            border-style: solid;
            border-color: #38bdf8 transparent;
            display: block;
            width: 0;
        }
        @keyframes bubblePop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="presentation-stage">
        <!-- 3D Güneş Tıklama Alanı -->
        <div id="hotspot-sun" class="hotspot-card" title="Güneş'e Dokun! (Solar Alevler)" onclick="triggerAudioEffect('sun')"></div>

        <!-- Astronot Tıklama Alanı -->
        <div id="hotspot-astro" class="hotspot-card" title="Astronota Dokun!" onclick="triggerAudioEffect('astro')"></div>

        <!-- 5 Adet İnteraktif Bilgi Kartı Alanı -->
        <div id="card-yildiz" class="hotspot-card" title="Yıldız Özelliği" onclick="triggerAudioEffect('yildiz')"></div>
        <div id="card-sicaklik" class="hotspot-card" title="Sıcaklık Değerleri" onclick="triggerAudioEffect('sicaklik')"></div>
        <div id="card-yas" class="hotspot-card" title="Güneş'in Yaşı" onclick="triggerAudioEffect('yas')"></div>
        <div id="card-isi-isik" class="hotspot-card" title="Dünya'ya Isı ve Işık" onclick="triggerAudioEffect('isi')"></div>
        <div id="card-gazlar" class="hotspot-card" title="Hidrojen ve Helyum Gazları" onclick="triggerAudioEffect('gaz')"></div>

        <!-- Astronot Konuşma Baloncuğu -->
        <div id="speech-bubble">
            <span id="speech-text">Merhaba! Güneş devasa bir nükleer enerji santralidir!</span>
        </div>

        <!-- Sabit Orijinal Rotalı Fenci Logosu İnteraktif Tıklama Alanı (Sağ Üst) -->
        <a href="https://rotalifenci.vercel.app" class="brand-logo-container" title="Rotalı Fenci Ana Sayfa"></a>

        <!-- Sabit Instagram Rozeti İnteraktif Tıklama Alanı (Sol Alt) -->
        <a href="https://instagram.com/rotalifenci" target="_blank" rel="noopener noreferrer" class="brand-insta-container" title="Instagram: @rotalifenci"></a>

        <!-- Sabit Akıllı Tahta Kontrol Çubuğu -->
        <div class="fixed-nav-bar">
            <button class="nav-btn" onclick="history.back()" title="Önceki Slayt"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="counter-badge">1.1 / GÜNEŞ</span>
            <button class="nav-btn primary" title="Sonraki Slayt">
                <span>İleri</span> <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button class="nav-btn" title="Ses Aç/Kapat" onclick="toggleAudio()"><i class="fa-solid fa-volume-high" id="snd-icon"></i></button>
            <button class="nav-btn" title="Tam Ekran" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <script>
        // 16:9 Ekran Ölçekleme (Pardus / Firefox / Chrome)
        function scaleStage() {
            const stage = document.getElementById('presentation-stage');
            if (!stage) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const scale = Math.min(vw / 1920, vh / 1080);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        window.addEventListener('DOMContentLoaded', scaleStage);

        // Web Audio Sentezleyici
        let soundEnabled = true;
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const speechMessages = {
            astro: "Ben senin uzay rehberinim! Güneş'in inanılmaz güçlerini birlikte keşfedeceğiz!",
            sun: "Güneş yüzeyi 5.500 °C! İç çekirdeği ise tam 15 MİLYON santigrat derece!",
            yildiz: "Güneş bir gezegen değil, kendi ışığını üreten orta büyüklükte bir YILDIZDIR!",
            sicaklik: "Merkezinde her saniye milyonlarca ton hidrojen helyuma dönüşerek devasa ısı üretir!",
            yas: "Güneş yaklaşık 4.6 milyar yaşında ve daha milyarlarca yıl parlamaya devam edecek!",
            isi: "Güneş ışınları 150 milyon kilometrelik yolu sadece 8 dakikada aşarak Dünya'mıza ulaşır!",
            gaz: "%74 Hidrojen ve %24 Helyum! Güneş katı bir kaya değil, dev bir gaz topudur!"
        };

        function triggerAudioEffect(key) {
            // Animasyon darbesi ver
            const el = document.getElementById(key === 'sun' ? 'hotspot-sun' : (key === 'astro' ? 'hotspot-astro' : 'card-' + key));
            if (el) {
                el.classList.remove('active-pulse');
                void el.offsetWidth;
                el.classList.add('active-pulse');
                setTimeout(() => el.classList.remove('active-pulse'), 1200);
            }

            // Baloncuğu göster
            const bubble = document.getElementById('speech-bubble');
            const text = document.getElementById('speech-text');
            if (bubble && text && speechMessages[key]) {
                text.innerText = speechMessages[key];
                bubble.style.display = 'block';
                clearTimeout(bubble.timeout);
                bubble.timeout = setTimeout(() => { bubble.style.display = 'none'; }, 4500);
            }

            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = key === 'sun' ? 'sawtooth' : 'triangle';
                const startFreq = key === 'sun' ? 120 : (key === 'astro' ? 580 : 440);
                const endFreq = key === 'sun' ? 260 : (key === 'astro' ? 880 : 660);
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {}
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('snd-icon');
            if (icon) {
                icon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-red-500';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
