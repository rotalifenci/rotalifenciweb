<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fen Bilimleri Passaparola Oyunu (5, 6, 7. Sınıf)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <div class="logo-icon">м</div>
      <div class="title-group">
        <h1>FEN B�I��IMLERñ PASSAPAROLA</h1>
        <span>5, 6 ve 7. Sınıf Genel Fen Bilimleri Oyunu</span>
      </div>
    </div>
    <div class="header-controls">
      <button id="btnTeamMode" class="btn-ctrl"><span>📑</span> Tekli Mod</button>
      <button id="btnTimerToggle" class="btn-ctrl"><span>▶️</span> Süreyi Baɟlat</button>
      <button id="btnSound" class="btn-ctrl"><span>🔤</span> Ses Açı�k</button>
      <button id="btnFullscreen" class="btn-ctrl"><span>⛶</span> Tam Ekran</button>
      <button id="btnReset" class="btn-ctrl"><span>🔩</span> Sıfırla</button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="game-container">
    <!-- Left: Passaparola Wheel -->
    <section class="wheel-wrapper">
      <div id="wheelContainer" class="wheel-container">
        <div id="wheelCenter" class="wheel-center">
          <div id="centerLetter" class="center-letter">A</div>
          <div class="center-info">Aktif Harf</div>
          <div class="center-stats">
            <span class="stat-d">D: <span id="statD">0</span></span>
            <span class="stat-y">Y: <span id="statY">0</span></span>
            <span class="stat-p">P: <span id="statP">0</span></span>
          </div>
        </div>
      </div>
    </section>

@    <!-- Right: Question & Controls Card -->
    <section class="question-card">
      <div id="teamBar" class="team-bar" style="display: none;">
        <div id="teamACard" class="team-card active-team">
          <span class="team-title">🔅 A Grubu:</span>
          <span id="teamAScore" class="team-score">0</span>
        </div>
        <div id="teamBCard" class="team-card">
          <span class="team-title">🔴 B Grubu:</span>
          <span id="teamBScore" class="team-score">0</span>
        </div>
      </div>

      <div class="q-header">
        <div class="q-badge" id="qBadge">A Harfi (Elektrik)</div>
        <div class="q-grade" id="qGrade">5. Sınıf</div>
        <div id="timerBox" class="timer-box">
          <span class="timer-icon">⟱️</span>
          <span id="timerText" class="timer-text">04:00</span>
        </div>
      </div>

      <div class="q-body">
        <div class="q-text" id="qText">Soru yükleniyor...</div>
        <div class="q-answer-reveal" id="qReveal">CEVAP</div>
      </div>

      <div class="input-area">
        <input type="text" id="txtAnswer" class="txt-answer" placeholder="Cevabı yazıp Enter'a basın veya alttaki butonları kullanın.." autocomplete="off">
        <button id="btnShowAnswer" class="btn-hint" title="Cevabı Göster (Bısayol: C)">👩 Göster</button>
      </div>

      <div class="btn-action-group">
        <button id="btnCorrect" class="btn-action btn-correct">
          <span>✔️ DOđRU</span>
          <small style="font-size: 0.75rem; opacity: 0.85;">+10 Puan (D Uuşu)</small>
        </button>
        <button id="btnPass" class="btn-action btn-pass">
          <span>⚡ PAS</span>
          <small style="font-size: 0.75rem; opacity: 0.85;">Sona Bırak (P / Boşluk)</small>
        </button>
        <button id="btnWrong" class="btn-action btn-wrong">
          <span>❌ �ANLİŞ</span>
          <small style="font-size: 0.75rem; opacity: 0.85;">(Y Uuşu)</small>
        </button>
      </div>
    </section>
  </main>

  <div id="endModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-trophy">���Z</div>
      <h2 id="modalTitle" class="modal-title">Tebrikler!</h2>
      <p id="modalSubtitle" class="modal-subtitle">Çarkı baɟarıyla tamamladınız.</p>
      <div class="modal-results-grid">
        <div class="m-res-box">
          <div class="m-res-title">Doğru</div>
          <div class="m-res-val" style="color: var(--accent-green);" id="mStatD">0</div>
        </div>
        <div class="m-res-box">
          <div class="m-res-title">Yanlış</div>
          <div class="m-res-val" style="color: var(--accent-red);" id="mStatY">0</div>
        </div>
        <div class="m-res-box">
          <div class="m-res-title">Toplam Puan</div>
          <div class="m-res-val" style="color: var(--accent-yellow);" id="mStatScore">0 Puan</div>
        </div>
      </div>
      <button id="btnPlayAgain" class="btn-restart">🔩 Yeniden Oyna</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
