<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b0f2b" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="blueStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Stars Background Pattern -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="120" r="1.5" />
    <circle cx="150" cy="80" r="1.0" />
    <circle cx="240" cy="180" r="1.5" />
    <circle cx="380" cy="90" r="1.2" />
    <circle cx="520" cy="140" r="1.8" />
    <circle cx="680" cy="70" r="1.0" />
    <circle cx="820" cy="110" r="1.5" />
    <circle cx="950" cy="60" r="2.0" />
    <circle cx="1100" cy="140" r="1.2" />
    <circle cx="120" cy="380" r="1.0" />
    <circle cx="260" cy="450" r="1.5" />
    <circle cx="420" cy="390" r="1.2" />
    <circle cx="720" cy="460" r="1.6" />
    <circle cx="1020" cy="420" r="1.5" />
    <circle cx="1140" cy="520" r="1.8" />
  </g>

  <!-- Cosmic Nebula Clouds Behind -->
  <ellipse cx="920" cy="320" rx="220" ry="160" fill="#a855f7" opacity="0.18" filter="url(#glowGold)" />
  <ellipse cx="800" cy="260" rx="180" ry="120" fill="#38bdf8" opacity="0.15" filter="url(#glowCyan)" />

  <!-- Badges Top Left -->
  <g transform="translate(80, 75)">
    <!-- 7. Sınıf Rozeti -->
    <rect x="0" y="0" width="220" height="42" rx="12" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1.5" />
    <text x="110" y="26" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1">
      7. SINIF • 1. ÜNİTE
    </text>

    <!-- Ünite Adı & Maarif -->
    <rect x="235" y="0" width="310" height="42" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="390" y="26" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1">
      UZAY ÇAĞI • MAARİF MODELİ
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="185" fill="url(#titleGrad)" font-family="'Orbitron', sans-serif" font-size="52" font-weight="900" letter-spacing="2" filter="url(#glowGold)">
    YILDIZ LABORATUVARI
  </text>

  <text x="80" y="245" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">
    Yıldızların Yaşam Döngüsü &amp; Uzay Simülatörü
  </text>

  <text x="80" y="295" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500">
    Nebulalar, Renk &amp; Sıcaklık İlişkisi, Süpernova ve Takımyıldızları (3D)
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 335)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#6366f1" stroke-width="1" />
    <text x="90" y="24" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ Yaşam Döngüsü
    </text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="180" height="38" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#f59e0b" stroke-width="1" />
    <text x="285" y="24" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ Renk &amp; Sıcaklık
    </text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="170" height="38" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1" />
    <text x="475" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ 4 Bulutsu Türü
    </text>
  </g>

  <!-- Pedagogical Fact Box -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="530" height="110" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.5" />
    <text x="24" y="38" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">
      KRİTİK MAARİF MODELİ KAZANIMI:
    </text>
    <text x="24" y="70" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">
      🔵 Mavi Yıldızlar EN SICAK (>10.000 K)
    </text>
    <text x="24" y="96" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">
      🔴 Kırmızı Yıldızlar EN SOĞUK (~3.000 K)
    </text>
  </g>

  <!-- Right Visual Area: 3D Celestial Graphics -->
  <g transform="translate(900, 320)">
    <!-- Big Glowing Star -->
    <circle cx="0" cy="0" r="110" fill="url(#starGrad)" filter="url(#glowGold)" />
    <circle cx="0" cy="0" r="125" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="8 6" />

    <!-- Pulsar / Supernova Ring -->
    <ellipse cx="0" cy="0" rx="170" ry="50" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" transform="rotate(-25)" />

    <!-- Twin Pulsar Jet Rays -->
    <line x1="-70" y1="-140" x2="70" y2="140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#glowCyan)" />

    <!-- Star Core Overlay -->
    <circle cx="0" cy="0" r="40" fill="#ffffff" opacity="0.95" />

    <!-- Polaris Badge Pin -->
    <g transform="translate(100, -110)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="65" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" text-anchor="middle">
        ★ POLARIS 3D
      </text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="80" y="625" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">
    Rotalı Fenci • MEB Pardus Akıllı Tahta, Tablet &amp; Telefon Uyumlu %100 Web Tabanlı Simülasyon
  </text>
</svg>
