<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#09132b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Floor Perspective Grid -->
  <g stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5">
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="580" x2="1200" y2="580" />
    <line x1="0" y1="650" x2="1200" y2="650" />
    <line x1="600" y1="450" x2="100" y2="675" />
    <line x1="600" y1="450" x2="350" y2="675" />
    <line x1="600" y1="450" x2="600" y2="675" />
    <line x1="600" y1="450" x2="850" y2="675" />
    <line x1="600" y1="450" x2="1100" y2="675" />
  </g>

  <!-- Left Side Badges & Titles -->
  <!-- Grade Badge -->
  <rect x="80" y="80" width="220" height="42" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="190" y="107" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">
    7. SINIF • 2. ÜNİTE
  </text>

  <!-- Maarif Modeli Badge -->
  <rect x="315" y="80" width="260" height="42" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
  <text x="445" y="107" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">
    TÜRKİYE YÜZYILI MAARİF
  </text>

  <!-- Main Title -->
  <text x="80" y="185" fill="url(#accentCyan)" font-family="'Orbitron', sans-serif" font-size="52" font-weight="900" letter-spacing="2" filter="url(#glowCyan)">
    İŞ LABORATUVARI
  </text>

  <text x="80" y="245" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">
    Fiziksel Anlamda İş Var mı, Yok mu?
  </text>

  <text x="80" y="295" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500">
    40 Farklı Etkileşimli 3D Deney &amp; 30 Öğrenci – 30 Deney Akıllı Sınıf Modu
  </text>

  <!-- Features Pill List -->
  <g transform="translate(80, 335)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="38" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ 40 Deney Simülasyonu
    </text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="170" height="38" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="#10b981" stroke-width="1" />
    <text x="260" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ 30 Öğrenci Modu
    </text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="165" height="38" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="#f59e0b" stroke-width="1" />
    <text x="442" y="24" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✓ W = F · Δx Formülü
    </text>
  </g>

  <!-- Formula Highlight Card -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="460" height="110" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="24" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">
      FİZİKSEL ANLAMDA İŞ KOŞULU:
    </text>
    <text x="24" y="80" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900">
      W = F · Δx
    </text>
    <text x="200" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="16">
      (Joule = Newton × Metre)
    </text>
  </g>

  <!-- Right Visual Area: 3D Isometric Representation -->
  <g transform="translate(820, 280)">
    <!-- Glow behind 3D object -->
    <circle cx="100" cy="80" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glowCyan)" />

    <!-- 3D Box Mesh Representation -->
    <polygon points="100,20 200,70 100,120 0,70" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
    <polygon points="0,70 100,120 100,210 0,160" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <polygon points="100,120 200,70 200,160 100,210" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />

    <!-- Force Vector Arrow F (Rightward) -->
    <g transform="translate(210, 140)">
      <line x1="0" y1="0" x2="110" y2="0" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
      <polygon points="110,-12 135,0 110,12" fill="#f43f5e" />
      <rect x="25" y="-35" width="70" height="26" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1" />
      <text x="60" y="-18" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">F = 40N</text>
    </g>

    <!-- Displacement Vector Arrow Δx (Rightward) -->
    <g transform="translate(100, 240)">
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#10b981" stroke-width="6" stroke-dasharray="8 4" stroke-linecap="round" />
      <polygon points="80,-9 100,0 80,9" fill="#10b981" />
      <rect x="-35" y="10" width="70" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="0" y="27" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">Δx = 2 m</text>
    </g>

    <!-- Work Badge -->
    <g transform="translate(40, -50)">
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#glowCyan)" />
      <text x="80" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
        ✓ İŞ YAPILDI!
      </text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="80" y="625" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">
    Rotalı Fenci • MEB Pardus Akıllı Tahta, Tablet &amp; Telefon Uyumlu %100 Web Tabanlı Simülasyon
  </text>
</svg>
