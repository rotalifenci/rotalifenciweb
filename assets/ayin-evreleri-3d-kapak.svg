<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <radialGradient id="sunGlow" cx="20%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Uzay -->
  <rect width="800" height="500" fill="url(#spaceBg)" />

  <!-- Yıldızlar -->
  <circle cx="80" cy="90" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="40" r="1.2" fill="#93c5fd" opacity="0.7"/>
  <circle cx="230" cy="120" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="70" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="450" cy="110" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="560" cy="60" r="1.8" fill="#bae6fd" opacity="0.8"/>
  <circle cx="680" cy="95" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="750" cy="160" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="100" cy="420" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="260" cy="440" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="620" cy="430" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="720" cy="380" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Yörünge Halka Çizgisi -->
  <ellipse cx="400" cy="250" rx="280" ry="140" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Güneş Işıltısı (Sol Taraf) -->
  <circle cx="40" cy="250" r="140" fill="url(#sunGlow)" filter="url(#glow)" opacity="0.85" />
  <circle cx="20" cy="250" r="65" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="0" cy="250" r="45" fill="#ffffff" />

  <!-- Dünya (Merkez) -->
  <circle cx="400" cy="250" r="50" fill="url(#earthGlow)" filter="url(#glow)" />
  <circle cx="400" cy="250" r="53" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" />
  <!-- Kıtalar -->
  <path d="M 380 230 Q 395 220 410 235 Q 425 250 415 270 Q 390 280 380 260 Z" fill="#22c55e" opacity="0.7" />
  <path d="M 410 220 Q 430 215 435 230 Q 425 245 410 240 Z" fill="#15803d" opacity="0.7" />

  <!-- Ay (Sağ Üstte Büyük & Fotogerçekçi) -->
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="55" fill="url(#moonGlow)" filter="url(#glow)" />
    <!-- Ay Kraterleri -->
    <circle cx="-15" cy="-10" r="12" fill="#334155" opacity="0.5"/>
    <circle cx="15" cy="18" r="16" fill="#334155" opacity="0.4"/>
    <circle cx="-20" cy="22" r="8" fill="#475569" opacity="0.5"/>
    <circle cx="10" cy="-22" r="10" fill="#475569" opacity="0.45"/>
    <circle cx="2" cy="0" r="5" fill="#64748b" opacity="0.6"/>
    <!-- Aydınlanma Çizgisi -->
    <path d="M 0 -55 A 55 55 0 0 1 0 55 A 40 55 0 0 0 0 -55" fill="#f8fafc" opacity="0.35" />
    <!-- Ay Dış Işıltı -->
    <circle cx="0" cy="0" r="57" fill="none" stroke="#e2e8f0" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Küçük Hilal, İlk Dördün, Son Dördün İkonları Yörüngede -->
  <!-- 0° Yeni Ay -->
  <circle cx="120" cy="250" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <!-- 90° İlk Dördün -->
  <g transform="translate(400, 390)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" />
    <path d="M 0 -14 A 14 14 0 0 1 0 14 Z" fill="#fbbf24" />
  </g>
  <!-- 270° Son Dördün -->
  <g transform="translate(400, 110)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" />
    <path d="M 0 -14 A 14 14 0 0 0 0 14 Z" fill="#fbbf24" />
  </g>

  <!-- Alt Bilgi / Başlık Rozeti -->
  <rect x="50" y="420" width="700" height="60" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#0284c7" stroke-width="2" />
  <text x="75" y="457" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#38bdf8" letter-spacing="1">AY'IN EVRELERİ • 3D UZAY SİMÜLATÖRÜ</text>
  <text x="560" y="456" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#fbbf24">5. SINIF FEN BİLİMLERİ</text>
</svg>
