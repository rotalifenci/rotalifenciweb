<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Sun Outer Corona Glow -->
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Core Glow -->
    <radialGradient id="sunCore" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Earth Gradient -->
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Cutaway Layer Gradients -->
    <radialGradient id="layerCore" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </radialGradient>
    <radialGradient id="layerRad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <radialGradient id="layerConv" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#spaceBg)" />

  <!-- Starfield Dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="45" cy="80" r="1.5" />
    <circle cx="120" cy="190" r="1" />
    <circle cx="210" cy="70" r="2" opacity="0.8" />
    <circle cx="340" cy="110" r="1.2" />
    <circle cx="680" cy="90" r="2" opacity="0.9" />
    <circle cx="750" cy="160" r="1.5" />
    <circle cx="710" cy="420" r="1.2" />
    <circle cx="620" cy="510" r="1.8" opacity="0.8" />
    <circle cx="140" cy="480" r="1.5" />
    <circle cx="80" cy="380" r="1" />
    <circle cx="280" cy="530" r="1.5" />
    <circle cx="520" cy="70" r="1.2" />
  </g>

  <!-- Corona Glow Burst -->
  <circle cx="340" cy="290" r="240" fill="url(#coronaGlow)" />

  <!-- Prominences / Solar Flares -->
  <path d="M 170 230 Q 130 190 160 160 Q 200 180 210 210 Z" fill="#f97316" opacity="0.75" filter="url(#glow)" />
  <path d="M 460 170 Q 510 130 520 170 Q 490 200 460 190 Z" fill="#f59e0b" opacity="0.7" filter="url(#glow)" />
  <path d="M 430 400 Q 480 440 450 470 Q 410 440 400 410 Z" fill="#ea580c" opacity="0.75" filter="url(#glow)" />

  <!-- Main 3D Sun Sphere -->
  <circle cx="340" cy="290" r="160" fill="url(#sunCore)" filter="url(#glow)" />

  <!-- Sunspot Group 1 -->
  <ellipse cx="280" cy="270" rx="14" ry="10" fill="#451a03" opacity="0.9" />
  <ellipse cx="280" cy="270" rx="8" ry="5" fill="#1c0b02" />
  <ellipse cx="298" cy="278" rx="8" ry="6" fill="#451a03" opacity="0.85" />
  <ellipse cx="298" cy="278" rx="4" ry="3" fill="#1c0b02" />

  <!-- Sunspot Group 2 -->
  <ellipse cx="380" cy="330" rx="16" ry="11" fill="#451a03" opacity="0.9" />
  <ellipse cx="380" cy="330" rx="9" ry="6" fill="#1c0b02" />
  <ellipse cx="402" cy="325" rx="7" ry="5" fill="#451a03" opacity="0.8" />

  <!-- 3D Wedge Cutaway Simulation Overlay -->
  <g transform="translate(340, 290)">
    <!-- Cutaway sector path (Upper-Right quadrant) -->
    <path d="M 0 0 L 140 -70 A 160 160 0 0 1 155 40 Z" fill="none" stroke="#fde047" stroke-width="2" opacity="0.6" stroke-dasharray="4 3" />
    <!-- Cutaway internal core wedge -->
    <path d="M 0 0 L 45 -22 A 50 50 0 0 1 50 12 Z" fill="url(#layerCore)" opacity="0.95" />
    <!-- Radiative zone wedge -->
    <path d="M 45 -22 L 85 -42 A 95 95 0 0 1 95 24 L 50 12 A 50 50 0 0 0 45 -22 Z" fill="url(#layerRad)" opacity="0.9" />
    <!-- Convection zone wedge -->
    <path d="M 85 -42 L 135 -67 A 150 150 0 0 1 150 38 L 95 24 A 95 95 0 0 0 85 -42 Z" fill="url(#layerConv)" opacity="0.85" />
  </g>

  <!-- Light Rays Traveling from Sun toward Earth -->
  <g stroke="#fde047" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.75">
    <line x1="490" y1="260" x2="650" y2="280" />
    <line x1="480" y1="290" x2="650" y2="295" />
    <line x1="490" y1="320" x2="650" y2="310" />
  </g>

  <!-- Photon Speed Packet Marker -->
  <circle cx="570" cy="295" r="5" fill="#ffffff" filter="url(#glow)" />
  <text x="570" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#fde047" text-anchor="middle">300.000 km/s</text>

  <!-- Realistic 3D Earth (Day side facing Sun, Night side dark) -->
  <g transform="translate(685, 295)">
    <!-- Atmosphere Glow -->
    <circle cx="0" cy="0" r="28" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
    <!-- Earth Base -->
    <circle cx="0" cy="0" r="24" fill="url(#earthGrad)" />
    <!-- Continent Green Shapes -->
    <path d="M -18 -8 Q -10 -16 -4 -10 Q 0 -6 -6 2 Q -12 6 -18 -8 Z" fill="#22c55e" opacity="0.85" />
    <path d="M -16 6 Q -8 4 -4 12 Q -10 18 -16 12 Z" fill="#16a34a" opacity="0.85" />
    <!-- Clouds -->
    <path d="M -18 -4 Q -10 -2 -2 -8 Q 6 -6 0 0 Q -10 2 -18 -4 Z" fill="#ffffff" opacity="0.6" />
    <!-- Night Shadow Terminator (Crescent shape) -->
    <path d="M 0 -24 A 24 24 0 0 1 24 0 A 24 24 0 0 1 0 24 A 24 24 0 0 0 0 -24 Z" fill="#020617" opacity="0.88" />
  </g>

  <!-- Distance & Time Badge Under Space Line -->
  <rect x="470" y="340" width="230" height="36" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <text x="585" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle">149.600.000 KM</text>
  <text x="585" y="369" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">Işığın Yolculuğu: 8 dk 20 sn</text>

  <!-- Top Glass Badge -->
  <rect x="30" y="25" width="310" height="42" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="52" cy="46" r="12" fill="#f59e0b" />
  <text x="52" y="50" font-family="'Font Awesome 6 Free', sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">☀️</text>
  <text x="74" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#fef08a" letter-spacing="0.5">GÜNEŞ'İ KEŞFEDİYORUM</text>
  <text x="74" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" letter-spacing="1">5. SINIF FEN BİLİMLERİ • 3D UZAY</text>

  <!-- Bottom Interactive Badges -->
  <g transform="translate(30, 525)">
    <!-- Badge 1: 3D Katmanlı Yapı -->
    <rect x="0" y="0" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" />
    <text x="82" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle">3D KATMANLI YAPI</text>
    <text x="82" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">Çekirdekten Koronaya</text>

    <!-- Badge 2: Dönme & Lekeler -->
    <rect x="180" y="0" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <text x="262" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#38bdf8" text-anchor="middle">GÜNEŞ'İN DÖNMESİ</text>
    <text x="262" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">25 Günlük Eksen Hareketi</text>

    <!-- Badge 3: 109 Kat Büyüklük -->
    <rect x="360" y="0" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <text x="442" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#10b981" text-anchor="middle">109 KAT BÜYÜKLÜK</text>
    <text x="442" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">1,3 Milyon Dünya Sığar</text>

    <!-- Badge 4: Maarif Modeli -->
    <rect x="540" y="0" width="220" height="38" rx="10" fill="#991b1b" fill-opacity="0.85" stroke="#f87171" stroke-width="1.2" />
    <text x="650" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">ROTALI FENCİ BAŞYAPITI</text>
    <text x="650" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#fecaca" text-anchor="middle">Maarif Modeli %100 Uyumlu</text>
  </g>
</svg>
