<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a164d" />
      <stop offset="35%" stop-color="#140f35" />
      <stop offset="70%" stop-color="#0a081e" />
      <stop offset="100%" stop-color="#05040d" />
    </radialGradient>
    
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="20%" stop-color="#ffcc00" />
      <stop offset="55%" stop-color="#ff6600" />
      <stop offset="85%" stop-color="#cc2200" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#880000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="titleIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.96   0 1 0 0 0.62   0 0 1 0 0.04  0 0 0 0.6 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Clip Paths -->
    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="960" height="540" rx="20" ry="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <!-- Base Background -->
    <rect width="960" height="540" fill="url(#spaceGlow)" />

    <!-- Nebula clouds & atmospheric glow -->
    <circle cx="850" cy="90" r="320" fill="#4338ca" opacity="0.25" filter="url(#glowGold)" />
    <circle cx="100" cy="450" r="280" fill="#9333ea" opacity="0.2" filter="url(#glowGold)" />
    <circle cx="480" cy="270" r="240" fill="#0284c7" opacity="0.12" filter="url(#glowGold)" />

    <!-- Background Stars & Twinkles -->
    <g fill="#ffffff" opacity="0.6">
      <circle cx="80" cy="60" r="1.5" />
      <circle cx="140" cy="120" r="2" opacity="0.8" />
      <circle cx="210" cy="45" r="1" />
      <circle cx="340" cy="85" r="2.5" opacity="0.9" />
      <circle cx="410" cy="40" r="1.5" />
      <circle cx="580" cy="70" r="2" />
      <circle cx="720" cy="50" r="1.5" />
      <circle cx="890" cy="70" r="2" />
      <circle cx="920" cy="160" r="1.5" />
      <circle cx="870" cy="250" r="1" />
      <circle cx="940" cy="380" r="2" />
      <circle cx="830" cy="480" r="1.5" />
      <circle cx="680" cy="510" r="2" />
      <circle cx="520" cy="490" r="1" />
      <circle cx="390" cy="520" r="2" />
      <circle cx="240" cy="490" r="1.5" />
      <circle cx="120" cy="510" r="2.5" opacity="0.7" />
      <circle cx="60" cy="390" r="1.5" />
      <circle cx="90" cy="260" r="2" />
      <circle cx="180" cy="210" r="1" />
      <circle cx="780" cy="180" r="2.5" opacity="0.8" />
    </g>

    <!-- Sparkling 4-point stars -->
    <path d="M140,120 Q140,128 148,128 Q140,128 140,136 Q140,128 132,128 Q140,128 140,120 Z" fill="#ffd700" opacity="0.9" />
    <path d="M840,90 Q840,100 850,100 Q840,100 840,110 Q840,100 830,100 Q840,100 840,90 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M720,440 Q720,448 728,448 Q720,448 720,456 Q720,448 712,448 Q720,448 720,440 Z" fill="#fbbf24" opacity="0.8" />

    <!-- Orbital rings in background -->
    <ellipse cx="480" cy="300" rx="460" ry="180" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="6 8" />
    <ellipse cx="480" cy="300" rx="380" ry="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />

    <!-- Sun Illustration (Top Right Glow) -->
    <circle cx="850" cy="100" r="140" fill="url(#sunGlow)" />
    <circle cx="850" cy="100" r="55" fill="#fffbeb" opacity="0.95" filter="url(#glowGold)" />
    <!-- Sun corona rays -->
    <g stroke="#f59e0b" stroke-width="2.5" opacity="0.5">
      <line x1="850" y1="20" x2="850" y2="40" />
      <line x1="850" y1="160" x2="850" y2="180" />
      <line x1="770" y1="100" x2="790" y2="100" />
      <line x1="910" y1="100" x2="930" y2="100" />
      <line x1="795" y1="45" x2="810" y2="60" />
      <line x1="890" y1="140" x2="905" y2="155" />
      <line x1="795" y1="155" x2="810" y2="140" />
      <line x1="890" y1="60" x2="905" y2="45" />
    </g>

    <!-- Earth Illustration (Bottom Left Corner) -->
    <g transform="translate(70, 390)">
      <circle cx="45" cy="45" r="45" fill="#0369a1" />
      <!-- Continents -->
      <path d="M20,25 Q35,15 50,30 Q65,45 45,65 Q30,75 25,60 Z" fill="#15803d" opacity="0.85" />
      <path d="M55,20 Q70,25 75,40 Q65,55 55,45 Z" fill="#16a34a" opacity="0.85" />
      <!-- Clouds -->
      <path d="M15,40 Q30,35 45,42 Q30,50 15,40 Z" fill="#ffffff" opacity="0.45" />
      <path d="M40,65 Q60,60 70,70 Q55,75 40,65 Z" fill="#ffffff" opacity="0.4" />
      <!-- Earth Atmosphere Glow -->
      <circle cx="45" cy="45" r="48" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    </g>

    <!-- Moon Illustration (Floating near right side) -->
    <g transform="translate(800, 370)">
      <circle cx="32" cy="32" r="32" fill="#cbd5e1" />
      <!-- Moon Craters -->
      <circle cx="20" cy="22" r="6" fill="#94a3b8" opacity="0.7" />
      <circle cx="44" cy="28" r="8" fill="#94a3b8" opacity="0.6" />
      <circle cx="28" cy="44" r="5" fill="#94a3b8" opacity="0.65" />
      <circle cx="45" cy="46" r="3.5" fill="#94a3b8" opacity="0.6" />
      <circle cx="16" cy="38" r="3" fill="#94a3b8" opacity="0.5" />
      <!-- Moon Shadow Crescent -->
      <path d="M32,0 A32,32 0 0,1 32,64 A26,32 0 0,0 32,0 Z" fill="#475569" opacity="0.4" />
      <circle cx="32" cy="32" r="34" fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.5" />
    </g>

    <!-- Top Decorative Header Tag -->
    <g transform="translate(480, 48)">
      <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="url(#headerGrad)" stroke-width="1.8" filter="url(#dropShadow)" />
      <circle cx="-236" cy="0" r="5" fill="#f59e0b" />
      <text x="0" y="5" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="900" fill="#e2e8f0" letter-spacing="2" text-anchor="middle">
        5. SINIF FEN BİLİMLERİ • 1. ÜNİTE
      </text>
      <circle cx="236" cy="0" r="5" fill="#38bdf8" />
    </g>

    <!-- Unit Subtitle Banner -->
    <text x="480" y="112" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#94a3b8" letter-spacing="3" text-anchor="middle">
      GÜNEŞ, DÜNYA VE AY
    </text>

    <!-- Main Exam Title Container -->
    <!-- Work Number Big Badge (Floating Above Section Name) -->
    <g transform="translate(480, 165)">
      <rect x="-110" y="-18" width="220" height="36" rx="12" fill="url(#badgeGold)" stroke="#fde047" stroke-width="2" filter="url(#glowGold)" />
      <text x="0" y="6" font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">
        ⭐ 1. SINAV ⭐
      </text>
    </g>

    <!-- Primary Section Name: AÇIK UÇLU KLASİK SINAVI -->
    <g filter="url(#glowTitle)">
      <!-- 3D Shadow layer -->
      <text x="480" y="248" font-family="'Montserrat', 'Arial Black', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900" fill="#0f172a" letter-spacing="1.5" text-anchor="middle">
        AÇIK UÇLU KLASİK SINAVI
      </text>
      <!-- Foreground Text -->
      <text x="480" y="244" font-family="'Montserrat', 'Arial Black', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900" fill="url(#titleGold)" letter-spacing="1.5" text-anchor="middle">
        AÇIK UÇLU KLASİK SINAVI
      </text>
    </g>

    <!-- Section Sub-banner: KLASİK SINAV – 1 -->
    <g transform="translate(480, 298)">
      <text x="0" y="0" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-size="22" font-weight="900" fill="url(#titleIndigo)" letter-spacing="4" text-anchor="middle">
        KLASİK SINAV – 1
      </text>
    </g>

    <!-- Central Exam Icon & Decorative Badges -->
    <g transform="translate(480, 360)">
      <!-- Center Glass Card -->
      <rect x="-340" y="-28" width="680" height="56" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" filter="url(#dropShadow)" />
      
      <!-- Feature Pill 1: 30 Soru -->
      <g transform="translate(-220, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">
          📝 30 ÖZGÜN SORU
        </text>
      </g>

      <!-- Feature Pill 2: Rubrikli Çözüm -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
        <text x="0" y="5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="middle">
          🎯 PUANLAMA RUBRİKLİ
        </text>
      </g>

      <!-- Feature Pill 3: Maarif Modeli -->
      <g transform="translate(220, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="10" fill="#1e1b4b" stroke="#10b981" stroke-width="1.2" />
        <text x="0" y="5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle">
          ✨ MAARİF MODELİ
        </text>
      </g>
    </g>

    <!-- Bottom Footer Bar -->
    <g transform="translate(0, 470)">
      <rect width="960" height="70" fill="#030712" fill-opacity="0.9" />
      <line x1="0" y1="0" x2="960" y2="0" stroke="url(#headerGrad)" stroke-width="2" />
      
      <!-- Left: Rotalı Fenci Brand -->
      <g transform="translate(50, 42)">
        <circle cx="12" cy="-6" r="14" fill="#6366f1" />
        <path d="M12,-16 L16,-4 L8,-4 Z" fill="#ffffff" />
        <path d="M12,4 L16,-4 L8,-4 Z" fill="#cbd5e1" opacity="0.6" />
        <text x="36" y="-1" font-family="'Montserrat', system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">
          ROTALI FENCİ
        </text>
        <text x="160" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
          • YAZILIYA HAZIRLIK MASTER SERİSİ
        </text>
      </g>

      <!-- Right: Detailed Info & Status Badge -->
      <g transform="translate(910, 42)">
        <rect x="-210" y="-18" width="210" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="-194" cy="-2" r="4" fill="#22c55e" />
        <text x="-95" y="3" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f1f5f9" letter-spacing="0.5" text-anchor="middle">
          ÇÖZÜMLÜ &amp; CEVAP ANAHTARLI
        </text>
      </g>
    </g>

    <!-- Outer Modern Border Frame -->
    <rect x="2" y="2" width="956" height="536" rx="18" ry="18" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.4" />
    <rect x="8" y="8" width="944" height="524" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
  </g>
</svg>