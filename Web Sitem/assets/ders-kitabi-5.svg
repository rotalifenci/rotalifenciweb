<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="100%" height="100%">
  <defs>
    <!-- Arka Plan Gradyan -->
    <linearGradient id="bgGrad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Altın / Canlı Vurgu Gradyan -->
    <linearGradient id="accentGrad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Kitap Sırtı Gölgesi -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)"/>
      <stop offset="12%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="25%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>

    <!-- Sayfa Kenarı Efekti -->
    <linearGradient id="edgeGlow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="5%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>

    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arka Plan (A4 595x842) -->
  <rect width="595" height="842" rx="18" fill="url(#bgGrad-5)"/>

  <!-- Kozmik & Bilim Arka Plan Motifleri -->
  <circle cx="530" cy="180" r="240" fill="#34d399" fill-opacity="0.08"/>
  <circle cx="80" cy="720" r="280" fill="#ffffff" fill-opacity="0.04"/>
  <path d="M-50,300 Q150,200 350,320 T700,280" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <path d="M-50,330 Q180,240 380,350 T750,310" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- Üst MEB Resmi Bandı -->
  <g transform="translate(65, 45)">
    <rect x="0" y="0" width="465" height="48" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="232" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">T.C. MİLLÎ EĞİTİM BAKANLIĞI</text>
  </g>

  <!-- Sağ Üst 3D Sınıf Rozeti -->
  <g transform="translate(425, 120)" filter="url(#shadow3d)">
    <circle cx="58" cy="58" r="58" fill="url(#accentGrad-5)"/>
    <circle cx="58" cy="58" r="51" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="6 4"/>
    <text x="58" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0f172a" text-anchor="middle">5</text>
    <text x="58" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#0f172a" letter-spacing="1.5" text-anchor="middle">SINIF</text>
  </g>

  <!-- Kitap Başlık Grubu -->
  <g transform="translate(68, 160)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#34d399" letter-spacing="2">ORTAOKUL VE İMAM HATİP ORTAOKULU</text>
    
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="1.5">FEN</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="1.5">BİLİMLERİ</text>
    
    <rect x="0" y="172" width="160" height="7" rx="3.5" fill="url(#accentGrad-5)"/>
    
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3.5">DERS KİTABI - 1</text>
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85" letter-spacing="1">MEB 2026 - 2027 GÜNCEL MÜFREDAT</text>
  </g>

  <!-- Merkezi Bilim Görseli: Atom, DNA, Gezegenler & Laboratuvar -->
  <g transform="translate(297, 545)" filter="url(#shadow3d)">
    <!-- Dış Işıma -->
    <circle cx="0" cy="0" r="130" fill="#34d399" fill-opacity="0.08"/>
    
    <!-- Çekirdek -->
    <circle cx="0" cy="0" r="28" fill="url(#accentGrad-5)"/>
    <text x="0" y="8" font-family="sans-serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle">⚛</text>

    <!-- Atom Yörüngeleri -->
    <ellipse cx="0" cy="0" rx="125" ry="46" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="125" ry="46" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="125" ry="46" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" transform="rotate(90)"/>

    <!-- Elektronlar -->
    <circle cx="95" cy="-52" r="10" fill="url(#accentGrad-5)"/>
    <circle cx="-95" cy="52" r="10" fill="url(#accentGrad-5)"/>
    <circle cx="0" cy="125" r="10" fill="#ffffff"/>
    <circle cx="0" cy="-125" r="10" fill="url(#accentGrad-5)"/>
  </g>

  <!-- Alt Kurumsal Bilgi Kutusu -->
  <g transform="translate(65, 715)">
    <rect x="0" y="0" width="465" height="70" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="232" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#34d399" letter-spacing="2.5" text-anchor="middle">DEVLET KİTAPLARI</text>
    <text x="232" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.9" letter-spacing="1.2" text-anchor="middle">ROTALI FENCİ DİJİTAL KÜTÜPHANE MERKEZİ</text>
  </g>

  <!-- 3D Kitap Sırtı & Kenar Gölgeleri -->
  <rect width="38" height="842" rx="18" fill="url(#spineShadow)"/>
  <line x1="38" y1="0" x2="38" y2="842" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
  <rect x="580" width="15" height="842" rx="18" fill="url(#edgeGlow)"/>
</svg>