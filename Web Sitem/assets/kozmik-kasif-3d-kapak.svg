<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-space" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sun-glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <!-- Corona Outer Glow -->
    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Earth Gradient -->
    <radialGradient id="earth-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Moon Surface Gradient -->
    <linearGradient id="moon-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Rover Metal Gradient -->
    <linearGradient id="rover-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Hologram Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="630" fill="url(#bg-space)" />

  <!-- Stars Field -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="120" r="1.5" />
    <circle cx="160" cy="80" r="1" />
    <circle cx="280" cy="180" r="2" fill="#38bdf8" />
    <circle cx="420" cy="90" r="1.2" />
    <circle cx="550" cy="160" r="1.8" />
    <circle cx="680" cy="70" r="1.5" />
    <circle cx="790" cy="140" r="2" fill="#fde047" />
    <circle cx="920" cy="95" r="1" />
    <circle cx="1060" cy="150" r="2" />
    <circle cx="1140" cy="80" r="1.5" />
    <circle cx="110" cy="280" r="1" />
    <circle cx="230" cy="340" r="1.5" />
    <circle cx="980" cy="280" r="1.2" />
    <circle cx="1110" cy="360" r="2" fill="#38bdf8" />
    <circle cx="860" cy="380" r="1" />
  </g>

  <!-- Giant Blazing Sun in Upper Right -->
  <g transform="translate(1050, 100)">
    <circle cx="0" cy="0" r="240" fill="url(#sun-corona)" filter="url(#glow-amber)" />
    <circle cx="0" cy="0" r="150" fill="url(#sun-glow)" filter="url(#glow-amber)" />
    <!-- Sunspots -->
    <ellipse cx="-40" cy="10" rx="14" ry="10" fill="#451a03" opacity="0.75" />
    <ellipse cx="-60" cy="35" rx="8" ry="6" fill="#451a03" opacity="0.8" />
    <ellipse cx="20" cy="-30" rx="12" ry="8" fill="#451a03" opacity="0.7" />
  </g>

  <!-- Holographic Orbit Rings -->
  <g transform="translate(680, 260)" opacity="0.45">
    <ellipse cx="0" cy="0" rx="360" ry="120" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow-cyan)" />
    <ellipse cx="0" cy="0" rx="280" ry="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Blue Planet Earth floating in space -->
  <g transform="translate(680, 250)">
    <!-- Earth Outer Atmosphere Glow -->
    <circle cx="0" cy="0" r="72" fill="#38bdf8" opacity="0.25" filter="url(#glow-cyan)" />
    <!-- Earth Body -->
    <circle cx="0" cy="0" r="65" fill="url(#earth-grad)" />
    <!-- Continents Shape -->
    <path d="M -25 -30 Q -10 -40 10 -25 Q 30 -10 25 20 Q 5 35 -15 25 Q -35 15 -30 -10 Z" fill="#22c55e" opacity="0.65" />
    <path d="M -45 5 Q -30 20 -15 40 Q -35 45 -48 20 Z" fill="#16a34a" opacity="0.6" />
    <!-- Swirling Clouds -->
    <path d="M -50 -15 Q 0 -35 45 -10 Q 20 5 -10 10 Q -40 5 -50 -15 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Moon Surface Landscape at the Bottom -->
  <g>
    <!-- Background Mountains -->
    <path d="M 0 460 Q 250 400 500 450 T 1000 420 L 1200 440 L 1200 630 L 0 630 Z" fill="#1e293b" />
    <!-- Foreground Moon Ground with Craters -->
    <path d="M 0 490 Q 300 460 650 500 T 1200 480 L 1200 630 L 0 630 Z" fill="url(#moon-ground)" />
    
    <!-- Crater 1 (Foreground Left) -->
    <ellipse cx="220" cy="560" rx="90" ry="25" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <ellipse cx="215" cy="563" rx="75" ry="18" fill="#0f172a" />

    <!-- Crater 2 (Right) -->
    <ellipse cx="980" cy="550" rx="110" ry="28" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <ellipse cx="975" cy="553" rx="90" ry="20" fill="#0f172a" />
  </g>

  <!-- 3D LUNAR ROVER (Left Center on Moon Surface) -->
  <g transform="translate(420, 480)">
    <!-- Laser Scanner Beam -->
    <polygon points="50,-80 280,-40 280,20 50,-70" fill="#06b6d4" opacity="0.25" filter="url(#glow-cyan)" />
    <line x1="50" y1="-75" x2="280" y2="-10" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow-cyan)" />

    <!-- Chassis Body -->
    <rect x="-70" y="-60" width="140" height="50" rx="12" fill="url(#rover-body)" stroke="#94a3b8" stroke-width="2" />
    <!-- Cockpit Dome -->
    <path d="M -40 -60 Q 0 -95 40 -60 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- High-Gain Dish Antenna -->
    <ellipse cx="45" cy="-75" rx="18" ry="8" fill="#f59e0b" transform="rotate(-30 45 -75)" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="30" y1="-60" x2="45" y2="-75" stroke="#94a3b8" stroke-width="3" />
    
    <!-- Heavy-Duty Lunar Wheels (6 Wheels) -->
    <g fill="#0f172a" stroke="#475569" stroke-width="3">
      <!-- Back Wheel -->
      <circle cx="-55" cy="5" r="24" />
      <circle cx="-55" cy="5" r="10" fill="#94a3b8" />
      <!-- Middle Wheel -->
      <circle cx="0" cy="5" r="24" />
      <circle cx="0" cy="5" r="10" fill="#94a3b8" />
      <!-- Front Wheel -->
      <circle cx="55" cy="5" r="24" />
      <circle cx="55" cy="5" r="10" fill="#94a3b8" />
    </g>

    <!-- Headlight Beams -->
    <polygon points="65,-40 180,-10 160,20 65,-30" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- Neil Armstrong Footprint Marker on Moon (Right) -->
  <g transform="translate(680, 555)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow-amber)" />
    <!-- Footprint shape -->
    <ellipse cx="0" cy="-3" rx="7" ry="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="0" cy="9" r="4" fill="#0f172a" />
    <text x="35" y="5" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" fill="#fef08a">Apollo Ayak İzi</text>
  </g>

  <!-- TOP-LEFT BRANDING & TITLES -->
  <g transform="translate(60, 90)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
    <text x="35" y="22" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc" letter-spacing="2">
      5. SINIF FEN BİLİMLERİ 1. ÜNİTE
    </text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Orbitron', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#glow-cyan)">
      KOZMİK KÂŞİF 3D
    </text>

    <!-- Subtitle -->
    <text x="2" y="140" font-family="'Rajdhani', sans-serif" font-size="28" font-weight="700" fill="#facc15" letter-spacing="4">
      AY VE GÜNEŞ KEŞİF ÜSSÜ
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="19" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">🌙 3D Rover Sürüşü</text>

      <rect x="140" y="0" width="135" height="28" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="152" y="19" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="700" fill="#fcd34d">☀️ Güneş Teleskobu</text>

      <rect x="285" y="0" width="145" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="297" y="19" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">🌌 Ay Evreleri Radarı</text>
    </g>
  </g>

  <!-- Bottom Platform Tag -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">
      ROTALI FENCİ EĞİTİM PLATFORMU
    </text>
  </g>
</svg>
