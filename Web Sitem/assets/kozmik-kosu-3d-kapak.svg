<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Uzay Arka Plan -->
    <radialGradient id="spaceGradient" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Güneş Parıltısı -->
    <radialGradient id="sunGlow" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Ay Küresi -->
    <radialGradient id="moonGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Pist Neon Işıltısı -->
    <linearGradient id="neonTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Uzay Arka Planı -->
  <rect width="800" height="500" fill="url(#spaceGradient)" />

  <!-- Yıldızlar -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="60" cy="50" r="1.5" />
    <circle cx="140" cy="90" r="1.2" />
    <circle cx="220" cy="40" r="1.8" />
    <circle cx="310" cy="75" r="1" />
    <circle cx="480" cy="55" r="1.5" />
    <circle cx="580" cy="80" r="2" fill="#fde047" />
    <circle cx="690" cy="45" r="1.2" />
    <circle cx="760" cy="95" r="1.6" />
    <circle cx="90" cy="360" r="1.2" />
    <circle cx="720" cy="380" r="1.8" />
  </g>

  <!-- Sol Üst: Dev Güneş -->
  <circle cx="60" cy="100" r="120" fill="url(#sunGlow)" opacity="0.85" filter="url(#glowFilter)" />
  <circle cx="40" cy="100" r="50" fill="#fbbf24" />

  <!-- Sağ Üst: Ay ve Evreler -->
  <g transform="translate(640, 140)">
    <circle cx="0" cy="0" r="70" fill="url(#moonGlow)" filter="url(#glowFilter)" />
    <!-- Ay Kraterleri -->
    <circle cx="-15" cy="-20" r="14" fill="#1e293b" opacity="0.5" />
    <circle cx="20" cy="15" r="18" fill="#1e293b" opacity="0.4" />
    <circle cx="-25" cy="22" r="10" fill="#334155" opacity="0.5" />
    <!-- İlk Dördün Aydınlanma Hilali -->
    <path d="M 0 -70 A 70 70 0 0 1 0 70 Z" fill="#ffffff" opacity="0.25" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Ortadaki 3 Şeritli Sonsuz Koşu Pisti (Perspektif) -->
  <g opacity="0.95">
    <!-- Pist Zemin Çerçevesi (Uzak Noktadan Yakına Açılan Yamuk) -->
    <polygon points="340,200 460,200 660,490 140,490" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
    
    <!-- Şerit Çizgileri (3 Şerit: Sol, Orta, Sağ) -->
    <line x1="380" y1="200" x2="313" y2="490" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="14 8" opacity="0.75" />
    <line x1="420" y1="200" x2="487" y2="490" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="14 8" opacity="0.75" />

    <!-- Dış Işıltılı Neon Kenarlar -->
    <line x1="340" y1="200" x2="140" y2="490" stroke="#a855f7" stroke-width="4" filter="url(#glowFilter)" />
    <line x1="460" y1="200" x2="660" y2="490" stroke="#ec4899" stroke-width="4" filter="url(#glowFilter)" />
  </g>

  <!-- Piste Yaklaşan 3D Bilimsel Kapı Kemeri -->
  <g transform="translate(400, 240)">
    <path d="M -90 40 L -90 -25 Q 0 -50 90 -25 L 90 40" fill="none" stroke="#38bdf8" stroke-width="5" filter="url(#glowFilter)" />
    <!-- Kapı Bilgi Paneli -->
    <rect x="-80" y="-35" width="160" height="24" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="0" y="-19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#38bdf8" text-anchor="middle">AY EVRESİ GEÇİDİ</text>
  </g>

  <!-- Koşan 3D Sevimli Astronot (Merkez Şeritte İleri Doğru Koşuyor) -->
  <g transform="translate(400, 370)">
    <!-- Gölge -->
    <ellipse cx="0" cy="65" rx="36" ry="10" fill="#000000" opacity="0.6" filter="url(#glowFilter)" />
    
    <!-- Jetpack Alevleri -->
    <circle cx="-16" cy="25" r="7" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="16" cy="25" r="7" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="-16" cy="30" r="4" fill="#ffffff" />
    <circle cx="16" cy="30" r="4" fill="#ffffff" />

    <!-- Jetpack Sırt Çantası -->
    <rect x="-24" y="-20" width="48" height="40" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Gövde / Uzay Giysisi -->
    <ellipse cx="0" cy="5" rx="26" ry="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Göğüs Kontrol Paneli -->
    <rect x="-12" y="-5" width="24" height="16" rx="4" fill="#0284c7" />
    <circle cx="-5" cy="3" r="2.5" fill="#22c55e" />
    <circle cx="5" cy="3" r="2.5" fill="#ef4444" />

    <!-- Kask (Helmet) -->
    <circle cx="0" cy="-35" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Vizör (Yansımalı Altın Cam) -->
    <ellipse cx="0" cy="-34" rx="22" ry="18" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" filter="url(#glowFilter)" />
    <path d="M -12 -42 Q 0 -48 12 -42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Koşan Bacaklar (Dinamik Koşu Hareketi) -->
    <!-- Sol Bacak (Geriye doğru) -->
    <line x1="-12" y1="32" x2="-22" y2="58" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
    <!-- Sağ Bacak (Öne doğru zıplamış) -->
    <line x1="12" y1="32" x2="20" y2="55" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />

    <!-- Kollar -->
    <line x1="-22" y1="-5" x2="-35" y2="15" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
    <line x1="22" y1="-5" x2="35" y2="5" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Puan Yıldızları (Pist Üzerinde Yüzen 3D Yıldızlar) -->
  <g fill="#fbbf24" stroke="#d97706" stroke-width="1.5" filter="url(#glowFilter)">
    <!-- Sol Şerit Yıldızı -->
    <polygon points="260,330 264,339 274,340 266,347 269,357 260,351 251,357 254,347 246,340 256,339" transform="scale(1.2) translate(-35,-45)" />
    <!-- Sağ Şerit Yıldızı -->
    <polygon points="520,330 524,339 534,340 526,347 529,357 520,351 511,357 514,347 506,340 516,339" transform="scale(1.2) translate(-75,-45)" />
  </g>

  <!-- Sol Üst Rozet: 3D Endless Runner -->
  <g transform="translate(45, 30)">
    <rect width="180" height="34" rx="10" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" />
    <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1">🏃 3D SONSUZ KOŞU</text>
  </g>

  <!-- Sağ Üst Rozet: 5. Sınıf Maarif Modeli -->
  <g transform="translate(575, 30)">
    <rect width="180" height="34" rx="10" fill="#090d16" stroke="#f59e0b" stroke-width="1.5" />
    <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">⭐ 5. SINIF 1. ÜNİTE</text>
  </g>

  <!-- Alt Başlık Cam HUD Kartı -->
  <g transform="translate(40, 400)">
    <rect width="720" height="75" rx="18" fill="#090d16" fill-opacity="0.94" stroke="#a855f7" stroke-width="2" filter="url(#glowFilter)" />
    
    <text x="30" y="35" font-family="'Orbitron', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="21" fill="#f8fafc" letter-spacing="1.5">
      KOZMİK KOŞU: <tspan fill="#38bdf8">AY EVRESİ AVI (3D)</tspan>
    </text>
    
    <text x="30" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">
      Güneş Tüneli • Ay Kraterleri • 8 Ay Evresi Avı • Yörünge Yarışı • Jetpack &amp; Mıknatıs
    </text>

    <!-- OYNA Butonu -->
    <g transform="translate(615, 18)">
      <rect width="85" height="38" rx="12" fill="url(#goldButton)" filter="url(#glowFilter)" />
      <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#030712" text-anchor="middle">OYNA ▶</text>
    </g>
  </g>
</svg>
