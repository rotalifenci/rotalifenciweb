<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" rx="24" />

  <!-- HEADER -->
  <rect x="40" y="30" width="1120" height="110" rx="20" fill="url(#headerGrad)" />
  <text x="70" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff">5. SINIF FEN BİLİMLERİ • 1. ÜNİTE BİLGİLENDİRME REHBERİ</text>
  <text x="70" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#e0f2fe">MEB Türkiye Yüzyılı Maarif Modeli | Konu Kazanımları, İşleniş Sırası ve Veli/Öğrenci Bilgilendirmeleri</text>

  <!-- KART 1: GÜNEŞ, DÜNYA VE AY -->
  <rect x="40" y="160" width="545" height="290" rx="20" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="2" />
  <rect x="60" y="180" width="220" height="36" rx="10" fill="#2563eb" />
  <text x="75" y="204" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">☀️ BÖLÜM 1: GÖK CİSİMLERİ</text>

  <!-- Güneş, Dünya, Ay Grafikleri -->
  <circle cx="110" cy="275" r="38" fill="url(#sunGrad)" />
  <text x="110" y="280" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">GÜNEŞ</text>

  <circle cx="215" cy="275" r="28" fill="url(#earthGrad)" />
  <text x="215" y="280" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">DÜNYA</text>

  <circle cx="295" cy="275" r="18" fill="url(#moonGrad)" />
  <text x="295" y="279" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#0f172a" text-anchor="middle">AY</text>

  <text x="340" y="245" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#93c5fd">📌 Büyüklük Sıralaması:</text>
  <text x="340" y="268" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#ffffff">Güneş &gt; Dünya &gt; Ay</text>
  <text x="340" y="292" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">Basketbol &gt; Nohut &gt; Mercimek</text>

  <rect x="60" y="340" width="505" height="90" rx="12" fill="#0f172a" />
  <text x="75" y="365" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38bdf8">Kazanım 5.1.1:</text>
  <text x="75" y="388" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#e2e8f0">• Güneş'in geometrik yapısı küreseldir, kendi ekseni etrafında döner.</text>
  <text x="75" y="410" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#e2e8f0">• Güneş sıcak gazlardan oluşur, ısı ve ışık kaynağımızdır.</text>

  <!-- KART 2: AY'IN EVRELERİ VE HAREKETLERİ -->
  <rect x="615" y="160" width="545" height="290" rx="20" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="2" />
  <rect x="635" y="180" width="220" height="36" rx="10" fill="#0891b2" />
  <text x="650" y="204" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">🌕 BÖLÜM 2: AY'IN EVRELERİ</text>

  <!-- 4 Ana Evre -->
  <g transform="translate(640, 235)">
    <!-- Yeniay -->
    <circle cx="45" cy="40" r="24" fill="#090d16" stroke="#64748b" stroke-width="2" />
    <text x="45" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Yeni Ay</text>

    <!-- İlk Dördün -->
    <circle cx="165" cy="40" r="24" fill="#090d16" stroke="#64748b" stroke-width="2" />
    <path d="M 165 16 A 24 24 0 0 1 165 64 Z" fill="#f8fafc" />
    <text x="165" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">İlk Dördün (D)</text>

    <!-- Dolunay -->
    <circle cx="285" cy="40" r="24" fill="#f8fafc" />
    <text x="285" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Dolunay</text>

    <!-- Son Dördün -->
    <circle cx="405" cy="40" r="24" fill="#090d16" stroke="#64748b" stroke-width="2" />
    <path d="M 405 16 A 24 24 0 0 0 405 64 Z" fill="#f8fafc" />
    <text x="405" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Son Dördün (Ters D)</text>
  </g>

  <rect x="635" y="340" width="505" height="90" rx="12" fill="#0f172a" />
  <text x="650" y="365" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#22d3ee">Önemli Hatırlatma:</text>
  <text x="650" y="388" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#e2e8f0">• Ay'ın ana evreleri arasındaki süre yaklaşık 1 haftadır (7 gün).</text>
  <text x="650" y="410" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#e2e8f0">• Ay'ın Dünya'dan hep aynı yüzü görünür çünkü dönme ve dolanma süresi eşittir (27.3 gün).</text>

  <!-- KART 3: VELİ VE ÖĞRENCİ BİLGİLENDİRMESİ -->
  <rect x="40" y="470" width="1120" height="295" rx="20" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2" />
  <rect x="60" y="490" width="280" height="36" rx="10" fill="#059669" />
  <text x="75" y="514" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">👨‍🏫 VELİ &amp; ÖĞRENCİ BİLGİLENDİRMESİ</text>

  <g transform="translate(60, 545)">
    <!-- Madde 1 -->
    <rect x="0" y="0" width="345" height="195" rx="14" fill="#0f172a" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#34d399">1. Ders Takibi ve Kazanımlar</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">1. Ünite 5 haftalık süreçte işlenecektir.</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">Öğrencilerin kavramları günlük yaşamla</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">ilişkilendirmesi beklenir.</text>
    <text x="20" y="125" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#a7f3d0">🎯 Hedef: Gökyüzü gözlem günlüğü tutmak.</text>

    <!-- Madde 2 -->
    <rect x="365" y="0" width="345" height="195" rx="14" fill="#0f172a" />
    <text x="385" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#38bdf8">2. Ödev ve Etkinlikler</text>
    <text x="385" y="55" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">Her hafta sonu portal üzerindeki testler ve</text>
    <text x="385" y="75" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">etkinlik föyleri çözülmelidir.</text>
    <text x="385" y="95" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">Eğitsel oyunlar tekrar amaçlı oynanabilir.</text>
    <text x="385" y="125" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#bae6fd">📱 Portal: rotalifenci.vercel.app</text>

    <!-- Madde 3 -->
    <rect x="730" y="0" width="345" height="195" rx="14" fill="#0f172a" />
    <text x="750" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#f43f5e">3. Yazılı Sınav Formatı</text>
    <text x="750" y="55" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">1. Dönem 1. Ortak Sınav MEB açık uçlu</text>
    <text x="750" y="75" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">senaryo modellerine göre hazırlanacaktır.</text>
    <text x="750" y="95" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">Ezber değil, kavrama ve analiz sorulur.</text>
    <text x="750" y="125" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#fecdd3">📝 Başarı Anahtarı: Kavram Haritaları</text>
  </g>
</svg>