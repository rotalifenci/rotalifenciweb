<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cardGrad-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.6)" />
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="600" height="400" fill="url(#bg-7)" />
  
  <!-- Dekoratif Geometrik Hatlar -->
  <circle cx="50" cy="50" r="160" fill="#f59e0b" opacity="0.08" />
  <circle cx="550" cy="350" r="200" fill="#f59e0b" opacity="0.06" />
  
  <!-- Üst Logo & Marka -->
  <g transform="translate(40, 40)">
    <rect width="36" height="36" rx="10" fill="#dc2626" />
    <path d="M12 24 L24 12 M24 12 L16 12 M24 12 L24 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" letter-spacing="2">ROTALI FENCİ</text>
    <text x="210" y="24" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="1">DİJİTAL EĞİTİM</text>
  </g>

  <!-- Rozet -->
  <g transform="translate(40, 95)">
    <rect width="210" height="28" rx="14" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="105" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" text-anchor="middle" letter-spacing="1">KAZANIM YAPRAK TESTİ</text>
  </g>

  <!-- Ana Kart İllüstrasyonu -->
  <g transform="translate(380, 140)" filter="url(#shadow)">
    <rect width="180" height="210" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect x="15" y="20" width="150" height="18" rx="4" fill="#f59e0b" opacity="0.85" />
    <rect x="15" y="50" width="150" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="90" y="86" font-size="28" text-anchor="middle">⚛️</text>
    <circle cx="30" cy="130" r="8" fill="#e2e8f0" />
    <rect x="45" y="126" width="115" height="8" rx="4" fill="#cbd5e1" />
    <circle cx="30" cy="155" r="8" fill="#e2e8f0" />
    <rect x="45" y="151" width="90" height="8" rx="4" fill="#cbd5e1" />
    <circle cx="30" cy="180" r="8" fill="#f59e0b" />
    <rect x="45" y="176" width="110" height="8" rx="4" fill="#f59e0b" opacity="0.4" />
  </g>

  <!-- Başlıklar -->
  <text x="40" y="175" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="1">7. SINIF</text>
  <text x="40" y="215" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24">FEN BİLİMLERİ</text>
  <text x="40" y="248" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">MEB MAARİF MODELİ</text>

  <!-- Alt Özellik Şeritleri -->
  <g transform="translate(40, 290)">
    <rect width="105" height="32" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="52" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓ Şekilli Soru</text>
    
    <rect x="115" width="105" height="32" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="167" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓ Cevap Anahtarı</text>
    
    <rect x="230" width="95" height="32" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="277" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓ Çözümlü</text>
  </g>

  <!-- Alt Bar -->
  <rect x="0" y="388" width="600" height="12" fill="url(#cardGrad-7)" />
</svg>