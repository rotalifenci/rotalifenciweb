<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1532" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Perspektif Zemin Izgarası -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="570" x2="1200" y2="570" />
    <line x1="0" y1="630" x2="1200" y2="630" />
    <line x1="200" y1="480" x2="0" y2="675" />
    <line x1="400" y1="480" x2="250" y2="675" />
    <line x1="600" y1="480" x2="600" y2="675" />
    <line x1="800" y1="480" x2="950" y2="675" />
    <line x1="1000" y1="480" x2="1200" y2="675" />
  </g>

  <!-- Merkez Deney Masası -->
  <rect x="250" y="470" width="700" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  <line x1="260" y1="485" x2="940" y2="485" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" />

  <!-- 3D Deney Kutusu -->
  <g transform="translate(600, 390)">
    <!-- Kutu Gövdesi -->
    <rect x="-80" y="-80" width="160" height="160" rx="14" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Çapraz Güçlendirme Şeritleri -->
    <line x1="-70" y1="-70" x2="70" y2="70" stroke="#bae6fd" stroke-width="3" opacity="0.4" />
    <line x1="70" y1="-70" x2="-70" y2="70" stroke="#bae6fd" stroke-width="3" opacity="0.4" />
    <!-- Ağırlık Rozeti -->
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#38bdf8" text-anchor="middle">5 kg</text>
  </g>

  <!-- YEŞİL OK: Sağa Kuvvet F1 = 20 N -->
  <g transform="translate(700, 390)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#10b981" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="200,-20 240,0 200,20" fill="#10b981" filter="url(#glow)" />
    <!-- Tabela -->
    <rect x="60" y="-55" width="120" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="120" y="-31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ecfdf5" text-anchor="middle">F₁ = 20 N</text>
  </g>

  <!-- KIRMIZI OK: Sola Kuvvet F2 = 12 N -->
  <g transform="translate(500, 390)">
    <line x1="0" y1="0" x2="-130" y2="0" stroke="#ef4444" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="-130,-20 -170,0 -130,20" fill="#ef4444" filter="url(#glow)" />
    <!-- Tabela -->
    <rect x="-140" y="-55" width="120" height="36" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
    <text x="-80" y="-31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#fef2f2" text-anchor="middle">F₂ = 12 N</text>
  </g>

  <!-- MAVİ OK: Bileşke Kuvvet R = 8 N Sağa -->
  <g transform="translate(600, 240)">
    <line x1="-30" y1="0" x2="110" y2="0" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="110,-22 155,0 110,22" fill="#3b82f6" filter="url(#glow)" />
    <!-- Tabela -->
    <rect x="-10" y="-50" width="170" height="38" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
    <text x="75" y="-25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="17" fill="#ffffff" text-anchor="middle">R = 8 N Sağa</text>
  </g>

  <!-- Üst Logo & Rozet -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-20" width="320" height="36" rx="18" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="800" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="2">6. SINIF • FEN BİLİMLERİ</text>
  </g>

  <!-- Ana Başlık -->
  <text x="600" y="145" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">KUVVET LABORATUVARI</text>
  <text x="600" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#94a3b8" text-anchor="middle">Kuvvetleri Dengele, Hareketi Keşfet! • Rotalı Fenci</text>

  <!-- Alt Özellik Çipleri -->
  <g transform="translate(600, 620)">
    <rect x="-380" y="-18" width="180" height="34" rx="17" fill="#0b1329" stroke="#10b981" stroke-width="1" />
    <text x="-290" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#34d399" text-anchor="middle">⚡ 5 İnteraktif Deney</text>

    <rect x="-180" y="-18" width="170" height="34" rx="17" fill="#0b1329" stroke="#38bdf8" stroke-width="1" />
    <text x="-95" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#38bdf8" text-anchor="middle">🎯 Gerçek Fizik Motoru</text>

    <rect x="10" y="-18" width="180" height="34" rx="17" fill="#0b1329" stroke="#f59e0b" stroke-width="1" />
    <text x="100" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#fbbf24" text-anchor="middle">🏆 10 Soruluk Değerlendirme</text>

    <rect x="210" y="-18" width="170" height="34" rx="17" fill="#0b1329" stroke="#c084fc" stroke-width="1" />
    <text x="295" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#c084fc" text-anchor="middle">📋 Gözlem Defteri</text>
  </g>
</svg>