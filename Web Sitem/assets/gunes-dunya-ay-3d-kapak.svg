<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c1228" />
      <stop offset="55%" stop-color="#040816" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <!-- Güneş Gradyanı -->
    <radialGradient id="sunGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Güneş Parıltısı -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Dünya Gradyanı -->
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Ay Gradyanı -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Uzay -->
  <rect width="800" height="500" fill="url(#spaceBg)" />

  <!-- Yıldızlar -->
  <g opacity="0.8">
    <circle cx="50" cy="60" r="1.5" fill="#fff"/>
    <circle cx="120" cy="180" r="1" fill="#93c5fd"/>
    <circle cx="210" cy="70" r="1.8" fill="#fde047"/>
    <circle cx="340" cy="40" r="1.2" fill="#fff"/>
    <circle cx="680" cy="90" r="1.5" fill="#fff"/>
    <circle cx="750" cy="220" r="1.3" fill="#bae6fd"/>
    <circle cx="720" cy="410" r="1.6" fill="#fff"/>
    <circle cx="140" cy="420" r="1.4" fill="#fef08a"/>
    <circle cx="390" cy="460" r="1.2" fill="#fff"/>
    <circle cx="570" cy="430" r="1.5" fill="#93c5fd"/>
  </g>

  <!-- Yörünge Çizgileri -->
  <!-- Dünya Yörüngesi (Elips) -->
  <ellipse cx="220" cy="250" rx="360" ry="140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  
  <!-- Ay Yörüngesi -->
  <ellipse cx="580" cy="250" rx="85" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Mekanik Bağlantı Kolları (Orrery Modeli Referansı) -->
  <path d="M 220 250 L 580 250" stroke="#fcd34d" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <path d="M 580 250 L 650 220" stroke="#7dd3fc" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- GÜNEŞ -->
  <!-- Dış Plazma Halesi -->
  <circle cx="220" cy="250" r="160" fill="url(#sunAura)" />
  <!-- Güneş Küresi -->
  <circle cx="220" cy="250" r="85" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Güneş Dönme Oku -->
  <path d="M 170 170 A 75 75 0 0 1 270 170" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="275,170 263,160 265,175" fill="#fef08a"/>

  <!-- DÜNYA -->
  <g transform="translate(580, 250)">
    <!-- Atmosfer Halesi -->
    <circle cx="0" cy="0" r="42" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
    <!-- Dünya Küresi -->
    <circle cx="0" cy="0" r="34" fill="url(#earthGrad)"/>
    <!-- Kıtalar -->
    <path d="M -12 -18 Q -4 -10 2 -16 Q 14 -12 8 0 Q -2 8 -8 4 Z" fill="#22c55e" opacity="0.85"/>
    <path d="M -5 6 Q 6 12 14 8 Q 12 20 2 22 Q -8 18 -5 6 Z" fill="#15803d" opacity="0.85"/>
    <circle cx="-10" cy="-28" r="7" fill="#f8fafc" opacity="0.7"/>
    <!-- Dünya Eksen Çizgisi (23.5 Derece Eğik) -->
    <line x1="-15" y1="-46" x2="15" y2="46" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Dünya Dönme Oku -->
    <path d="M -24 -24 A 32 32 0 0 1 24 -24" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="26,-24 16,-31 19,-18" fill="#67e8f9"/>
  </g>

  <!-- AY -->
  <g transform="translate(650, 220)">
    <!-- Ay Küresi -->
    <circle cx="0" cy="0" r="14" fill="url(#moonGrad)"/>
    <!-- Kraterler -->
    <circle cx="-4" cy="-3" r="2.5" fill="#475569" opacity="0.6"/>
    <circle cx="3" cy="4" r="3" fill="#475569" opacity="0.6"/>
    <circle cx="2" cy="-4" r="1.5" fill="#475569" opacity="0.7"/>
    <!-- Aynı Yüz İşareti (Kırmızı/Altın Pin) -->
    <circle cx="-10" cy="4" r="2" fill="#ef4444" filter="url(#glow)"/>
  </g>

  <!-- Üst Başlık Şeridi -->
  <rect x="30" y="30" width="310" height="42" rx="14" fill="#0f172a" opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="56" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" letter-spacing="1.5">5. SINIF • 3D HAREKET LABORATUVARI</text>

  <!-- Alt Başlık Kartı -->
  <rect x="30" y="405" width="480" height="65" rx="18" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="433" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19">Güneş, Dünya ve Ay</text>
  <text x="50" y="455" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12">Dönme &amp; Dolanma Hareketleri • Analog Saat Yön Göstergesi</text>

  <!-- 3D Etkileşim Rozeti -->
  <rect x="670" y="30" width="100" height="34" rx="12" fill="#f59e0b" filter="url(#glow)"/>
  <text x="696" y="52" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13">3D UZAY</text>
</svg>
