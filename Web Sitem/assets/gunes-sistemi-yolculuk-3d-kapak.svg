<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Sun Radiant Glow -->
    <radialGradient id="sunGlow" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>

    <!-- Planetary Gradients -->
    <radialGradient id="mercuryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <radialGradient id="venusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>

    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <radialGradient id="jupiterGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <radialGradient id="saturnGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <radialGradient id="uranusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>

    <radialGradient id="neptuneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Saturn Ring Gradient -->
    <linearGradient id="saturnRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0" />
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.9" />
      <stop offset="53%" stop-color="#050814" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </linearGradient>

    <!-- Atmospheric Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sunBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background Space -->
  <rect width="800" height="500" fill="url(#spaceGrad)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="50" cy="80" r="1.2" />
    <circle cx="120" cy="40" r="1.8" opacity="0.9" />
    <circle cx="190" cy="110" r="1" />
    <circle cx="270" cy="65" r="1.5" />
    <circle cx="340" cy="30" r="1" />
    <circle cx="430" cy="90" r="1.6" />
    <circle cx="520" cy="45" r="1.2" />
    <circle cx="600" cy="100" r="1.9" opacity="0.9" />
    <circle cx="680" cy="60" r="1" />
    <circle cx="750" cy="110" r="1.4" />
    <circle cx="90" cy="420" r="1.5" />
    <circle cx="180" cy="460" r="1" />
    <circle cx="310" cy="440" r="1.7" />
    <circle cx="480" cy="470" r="1.2" />
    <circle cx="640" cy="430" r="1.8" />
    <circle cx="720" cy="460" r="1" />
    <circle cx="770" cy="380" r="1.6" />
  </g>

  <!-- Distant Cosmic Nebula Dust -->
  <path d="M 0,260 Q 200,180 400,240 T 800,200" fill="none" stroke="#6366f1" stroke-width="60" opacity="0.12" filter="url(#sunBlur)" />
  <path d="M 0,280 Q 250,340 500,270 T 800,320" fill="none" stroke="#ec4899" stroke-width="45" opacity="0.08" filter="url(#sunBlur)" />

  <!-- Orbit Guides (Curved lines across canvas) -->
  <g fill="none" stroke="#38bdf8" stroke-dasharray="3,6" opacity="0.25">
    <ellipse cx="0" cy="250" rx="140" ry="200" />
    <ellipse cx="0" cy="250" rx="200" ry="240" />
    <ellipse cx="0" cy="250" rx="270" ry="290" />
    <ellipse cx="0" cy="250" rx="350" ry="340" />
    <ellipse cx="0" cy="250" rx="460" ry="400" />
    <ellipse cx="0" cy="250" rx="580" ry="460" />
    <ellipse cx="0" cy="250" rx="690" ry="510" />
    <ellipse cx="0" cy="250" rx="770" ry="550" />
  </g>

  <!-- THE GIGANTIC SUN (Left edge) -->
  <!-- Corona flares -->
  <circle cx="0" cy="250" r="170" fill="url(#sunGlow)" filter="url(#sunBlur)" opacity="0.85" />
  <circle cx="0" cy="250" r="130" fill="url(#sunGlow)" filter="url(#glow)" />
  <circle cx="0" cy="250" r="105" fill="#fef08a" opacity="0.9" />

  <!-- 1. MERKÜR -->
  <g transform="translate(140, 245)">
    <circle cx="0" cy="0" r="8" fill="url(#mercuryGrad)" />
    <!-- Crater marks -->
    <circle cx="-2" cy="-2" r="1.5" fill="#334155" opacity="0.4" />
    <circle cx="2" cy="3" r="1" fill="#334155" opacity="0.4" />
  </g>

  <!-- 2. VENÜS -->
  <g transform="translate(195, 240)">
    <circle cx="0" cy="0" r="14" fill="url(#venusGrad)" filter="url(#glow)" />
    <!-- Swirl atmosphere -->
    <path d="M -12,-3 Q 0,-6 12,-3" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6" />
    <path d="M -13,4 Q 0,1 13,4" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- 3. DÜNYA & AY -->
  <g transform="translate(265, 235)">
    <!-- Atmosphere rim -->
    <circle cx="0" cy="0" r="16.5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="url(#earthGrad)" />
    <!-- Continents -->
    <path d="M -8,-5 Q -3,-9 4,-4 Q 8,1 3,6 Q -5,8 -8,-5 Z" fill="#22c55e" opacity="0.85" />
    <!-- Clouds -->
    <path d="M -12,0 Q 0,-4 12,1" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.65" />
    <!-- Moon -->
    <circle cx="24" cy="-14" r="3.5" fill="#cbd5e1" />
  </g>

  <!-- 4. MARS -->
  <g transform="translate(335, 248)">
    <circle cx="0" cy="0" r="11" fill="url(#marsGrad)" />
    <!-- Polar ice cap -->
    <ellipse cx="0" cy="-9.5" rx="4.5" ry="1.5" fill="#f8fafc" opacity="0.9" />
    <ellipse cx="0" cy="9.5" rx="3.5" ry="1.2" fill="#f8fafc" opacity="0.8" />
  </g>

  <!-- ASTEROID BELT -->
  <g fill="#94a3b8" opacity="0.4">
    <circle cx="380" cy="220" r="1.5" />
    <circle cx="390" cy="255" r="2" />
    <circle cx="385" cy="280" r="1" />
    <circle cx="395" cy="235" r="1.8" />
    <circle cx="400" cy="270" r="1.2" />
  </g>

  <!-- 5. JÜPİTER (Gaz Devi) -->
  <g transform="translate(470, 230)">
    <circle cx="0" cy="0" r="46" fill="url(#jupiterGrad)" />
    <!-- Atmospheric Bands -->
    <path d="M -44,-16 Q 0,-20 44,-16" fill="none" stroke="#9a3412" stroke-width="4" opacity="0.75" />
    <path d="M -45,-5 Q 0,-8 45,-5" fill="none" stroke="#ffedd5" stroke-width="5" opacity="0.6" />
    <path d="M -45,8 Q 0,5 45,8" fill="none" stroke="#7c2d12" stroke-width="6" opacity="0.8" />
    <path d="M -44,22 Q 0,19 44,22" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.75" />
    <!-- Büyük Kırmızı Leke -->
    <ellipse cx="18" cy="10" rx="9" ry="5.5" fill="#991b1b" stroke="#fca5a5" stroke-width="1" />
  </g>

  <!-- 6. SATÜRN (Halkalı Dev) -->
  <g transform="translate(605, 245)">
    <!-- Back of ring -->
    <ellipse cx="0" cy="0" rx="66" ry="17" fill="none" stroke="url(#saturnRing)" stroke-width="14" transform="rotate(-18)" opacity="0.5" />
    <!-- Planet body -->
    <circle cx="0" cy="0" r="36" fill="url(#saturnGrad)" />
    <!-- Bands -->
    <path d="M -34,-6 Q 0,-10 34,-6" fill="none" stroke="#854d0e" stroke-width="3" opacity="0.6" />
    <path d="M -35,7 Q 0,3 35,7" fill="none" stroke="#fef9c3" stroke-width="3" opacity="0.5" />
    <!-- Front of ring -->
    <ellipse cx="0" cy="0" rx="66" ry="17" fill="none" stroke="url(#saturnRing)" stroke-width="14" transform="rotate(-18)" />
  </g>

  <!-- 7. URANÜS -->
  <g transform="translate(710, 235)">
    <!-- Vertical ring -->
    <ellipse cx="0" cy="0" rx="6" ry="24" fill="none" stroke="#67e8f9" stroke-width="1.8" opacity="0.65" transform="rotate(10)" />
    <circle cx="0" cy="0" r="19" fill="url(#uranusGrad)" />
  </g>

  <!-- 8. NEPTÜN -->
  <g transform="translate(775, 255)">
    <circle cx="0" cy="0" r="18" fill="url(#neptuneGrad)" />
    <!-- Cirrus clouds -->
    <path d="M -14,-4 Q 0,-8 14,-4" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
  </g>

  <!-- ================= TOP HUD OVERLAY ================= -->
  <!-- Top Badge -->
  <g transform="translate(30, 32)">
    <rect width="210" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="18" cy="17" r="7" fill="#38bdf8" />
    <text x="34" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="0.5">6. SINIF • 1. ÜNİTE</text>
  </g>

  <!-- 3D Sinematik Rozeti -->
  <g transform="translate(610, 32)">
    <rect width="160" height="34" rx="17" fill="#4338ca" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff">🎬 3D SİNEMATİK</text>
  </g>

  <!-- ================= BOTTOM CARD OVERLAY ================= -->
  <g transform="translate(30, 370)">
    <!-- Glassmorphic panel -->
    <rect width="740" height="100" rx="24" fill="#030712" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />

    <!-- Big Title -->
    <text x="30" y="42" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      GÜNEŞ SİSTEMİNDE YOLCULUK
    </text>

    <!-- Subtitle -->
    <text x="30" y="72" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
      8 Gezegen, Gerçek Boyut Karşılaştırmaları ve 3D Sinematik Uzay Keşfi
    </text>

    <!-- Action Pill Button -->
    <g transform="translate(560, 26)">
      <rect width="150" height="48" rx="16" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5" />
      <text x="75" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#ffffff">
        ▶ ANİMASYONU BAŞLAT
      </text>
    </g>
  </g>
</svg>
