<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Atmosphere Outer Glow -->
    <radialGradient id="atmosGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </radialGradient>

    <!-- Hydrosphere & Crust -->
    <linearGradient id="earthSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Mantle (Manto / Ateş Küre) -->
    <radialGradient id="mantleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>

    <!-- Core (Çekirdek / Ağır Küre) -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1.5" />
    <circle cx="160" cy="140" r="1" />
    <circle cx="220" cy="40" r="2" />
    <circle cx="110" cy="230" r="1" />
    <circle cx="290" cy="110" r="1.5" />
    <circle cx="80" cy="380" r="1.5" />
    <circle cx="180" cy="440" r="2" />
    <circle cx="680" cy="50" r="1.5" />
    <circle cx="740" cy="120" r="2" />
    <circle cx="620" cy="180" r="1" />
    <circle cx="730" cy="340" r="1" />
    <circle cx="670" cy="420" r="2" />
  </g>

  <!-- Earth Cutaway Visual (Center Right) -->
  <g transform="translate(560, 250)">
    <!-- Atmosphere Glow Ring -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4" filter="url(#glow)" />
    
    <!-- 1. Hava Küre (Atmosfer) -->
    <circle cx="0" cy="0" r="160" fill="url(#atmosGlow)" />

    <!-- 2. Su Küre & 3. Taş Küre (Dış Kabuk) -->
    <circle cx="0" cy="0" r="150" fill="url(#earthSurface)" />

    <!-- Cutaway Sector (Interior layers) -->
    <!-- Manto (Ateş Küre) -->
    <path d="M 0 0 L 140 0 A 140 140 0 1 1 -140 0 Z" fill="url(#mantleGrad)" />
    <path d="M 0 0 L 0 -140 A 140 140 0 0 1 140 0 Z" fill="url(#mantleGrad)" opacity="0.95" />

    <!-- Çekirdek (Ağır Küre) -->
    <circle cx="0" cy="0" r="65" fill="url(#coreGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.9" filter="url(#glow)" />

    <!-- Layer Indicator Lines & Dots -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
      <!-- Çekirdek Line -->
      <line x1="0" y1="0" x2="60" y2="-75" />
      <circle cx="60" cy="-75" r="3" fill="#ef4444" />

      <!-- Manto Line -->
      <line x1="45" y1="55" x2="115" y2="90" />
      <circle cx="115" cy="90" r="3" fill="#f59e0b" />

      <!-- Kabuk Line -->
      <line x1="-120" y1="-70" x2="-155" y2="-100" />
      <circle cx="-155" cy="-100" r="3" fill="#10b981" />
    </g>
  </g>

  <!-- Left Info & Branding Section -->
  <g transform="translate(60, 90)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="110" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.5">5. SINIF • 1. ÜNİTE</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">DÜNYA'NIN</text>
    <text x="0" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="1">5 KATMANI</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">İnteraktif Simülasyon &amp; Rozet Avı</text>

    <!-- Memory Rule Badge -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="310" height="42" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.95" />
      <text x="15" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="900">
        Hava ➔ Su ➔ Taş ➔ Ateş ➔ Ağır
      </text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="67" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5 Katman Kesiti</text>

      <rect x="145" y="0" width="135" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="212" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Gözlemlenebilirlik</text>

      <rect x="290" y="0" width="100" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="340" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Rozet Avı</text>
    </g>

    <!-- Brand Label -->
    <g transform="translate(0, 315)">
      <text x="0" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1">ROTALI FENCİ</text>
      <text x="110" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Maarif Modeli &amp; Akıllı Tahta</text>
    </g>
  </g>
</svg>
