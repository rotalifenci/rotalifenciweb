<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="60%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#000002"/>
    </radialGradient>
    <linearGradient id="moonSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555860"/>
      <stop offset="25%" stop-color="#3d4047"/>
      <stop offset="70%" stop-color="#24272c"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>
    <radialGradient id="earthGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Sky -->
  <rect width="800" height="450" fill="url(#spaceBg)"/>

  <!-- Tiny Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="40" r="1"/>
    <circle cx="160" cy="85" r="1.2"/>
    <circle cx="290" cy="30" r="0.8"/>
    <circle cx="340" cy="70" r="1.5"/>
    <circle cx="680" cy="50" r="1"/>
    <circle cx="740" cy="110" r="1.2"/>
    <circle cx="770" cy="35" r="0.9"/>
    <circle cx="120" cy="140" r="0.8"/>
  </g>

  <!-- Radiant Sun in Distance -->
  <circle cx="660" cy="90" r="22" fill="#fffbeb" filter="url(#glow)"/>
  <circle cx="660" cy="90" r="16" fill="#fef08a"/>

  <!-- Majestic Earth in Lunar Sky -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="54" fill="#0284c7" opacity="0.35" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="48" fill="url(#earthGlow)"/>
    <!-- Continents & Clouds silhouette -->
    <path d="M-22,-18 Q-10,-35 15,-25 Q30,-10 20,15 Q-5,32 -25,20 Q-35,0 -22,-18 Z" fill="#22c55e" opacity="0.55"/>
    <path d="M-30,-5 Q-20,15 -10,35 Q-18,40 -28,25 Z" fill="#15803d" opacity="0.45"/>
    <path d="M-40,-10 Q0,-45 42,-12 Q20,-5 -5,-8 Q-25,-12 -40,-10 Z" fill="#ffffff" opacity="0.65"/>
    <path d="M-15,10 Q10,18 35,5 Q15,28 -15,10 Z" fill="#ffffff" opacity="0.6"/>
    <!-- Atmosphere Rim -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Moon Surface with Craters -->
  <ellipse cx="400" cy="460" rx="600" ry="210" fill="url(#moonSurface)"/>
  <ellipse cx="140" cy="370" rx="85" ry="26" fill="#1e2126" stroke="#474b54" stroke-width="2"/>
  <ellipse cx="640" cy="350" rx="110" ry="32" fill="#1e2126" stroke="#474b54" stroke-width="2.5"/>
  <ellipse cx="420" cy="410" rx="70" ry="18" fill="#181a1f" stroke="#3f434b" stroke-width="1.5"/>
  <ellipse cx="310" cy="340" rx="35" ry="10" fill="#202328" stroke="#474b54" stroke-width="1"/>

  <!-- Bootprint Tracks -->
  <g fill="#181a1f" opacity="0.8">
    <ellipse cx="370" cy="370" rx="6" ry="3"/>
    <ellipse cx="382" cy="366" rx="6" ry="3"/>
    <ellipse cx="395" cy="363" rx="6" ry="3"/>
    <ellipse cx="408" cy="360" rx="6" ry="3"/>
    <ellipse cx="420" cy="358" rx="6" ry="3"/>
  </g>

  <!-- Apollo 11 Lunar Module "Eagle" Silhouette & Details -->
  <g transform="translate(490, 225)">
    <!-- Shadow -->
    <ellipse cx="-40" cy="100" rx="75" ry="14" fill="#090a0d" opacity="0.9"/>

    <!-- Landing Gear Legs -->
    <line x1="-30" y1="50" x2="-80" y2="95" stroke="#94a3b8" stroke-width="4"/>
    <line x1="30" y1="50" x2="80" y2="95" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-15" y1="50" x2="-35" y2="98" stroke="#94a3b8" stroke-width="3"/>
    <line x1="15" y1="50" x2="35" y2="98" stroke="#94a3b8" stroke-width="3"/>
    <!-- Footpads -->
    <ellipse cx="-80" cy="95" rx="14" ry="4" fill="#cbd5e1"/>
    <ellipse cx="80" cy="95" rx="14" ry="4" fill="#cbd5e1"/>
    <ellipse cx="-35" cy="98" rx="12" ry="3" fill="#cbd5e1"/>
    <ellipse cx="35" cy="98" rx="12" ry="3" fill="#cbd5e1"/>
    <!-- Ladder on Front Leg -->
    <line x1="-30" y1="50" x2="-80" y2="95" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="-40" y1="60" x2="-44" y2="58" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="-50" y1="69" x2="-54" y2="67" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="-60" y1="78" x2="-64" y2="76" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="-70" y1="87" x2="-74" y2="85" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Descent Stage (Octagonal Gold Foil) -->
    <polygon points="-42,20 42,20 52,55 -52,55" fill="url(#goldFoil)" stroke="#a16207" stroke-width="1"/>
    <rect x="-35" y="24" width="70" height="26" fill="#1e293b" opacity="0.3"/>

    <!-- Ascent Stage Cabin -->
    <polygon points="-28,20 28,20 34,-15 18,-28 -18,-28 -34,-15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <!-- Triangular Windows -->
    <polygon points="-18,-5 -6,-5 -12,-16" fill="#0284c7"/>
    <polygon points="18,-5 6,-5 12,-16" fill="#0284c7"/>
    <!-- Docking Hatch & Radar Antenna -->
    <rect x="-10" y="-33" width="20" height="6" fill="#94a3b8"/>
    <line x1="22" y1="-28" x2="35" y2="-45" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="36" cy="-46" r="6" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- RCS Thruster Quads -->
    <circle cx="-35" cy="0" r="3" fill="#ef4444"/>
    <circle cx="35" cy="0" r="3" fill="#ef4444"/>
  </g>

  <!-- Astronaut Neil Armstrong with American Flag -->
  <g transform="translate(320, 260)">
    <!-- Shadow -->
    <ellipse cx="-20" cy="78" rx="28" ry="6" fill="#090a0d" opacity="0.85"/>
    
    <!-- American Flag -->
    <line x1="-40" y1="78" x2="-40" y2="10" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="-40" y1="10" x2="-8" y2="10" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Flag Cloth (wrinkled) -->
    <rect x="-40" y="10" width="30" height="18" fill="#ef4444"/>
    <rect x="-40" y="13" width="30" height="3" fill="#ffffff"/>
    <rect x="-40" y="19" width="30" height="3" fill="#ffffff"/>
    <rect x="-40" y="25" width="30" height="3" fill="#ffffff"/>
    <rect x="-40" y="10" width="12" height="10" fill="#1e3a8a"/>

    <!-- Astronaut Figure (A7L Spacesuit) -->
    <!-- Boots -->
    <ellipse cx="6" cy="74" rx="6" ry="4" fill="#cbd5e1"/>
    <ellipse cx="-8" cy="72" rx="6" ry="4" fill="#cbd5e1"/>
    <!-- Legs -->
    <path d="M-10,50 L-8,72 L-4,72 L-5,50 Z" fill="#f1f5f9"/>
    <path d="M4,50 L6,74 L10,74 L8,50 Z" fill="#f1f5f9"/>
    <!-- Torso & Life Support Backpack (PLSS) -->
    <rect x="-16" y="26" width="12" height="24" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <rect x="-8" y="24" width="20" height="28" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Arms -->
    <path d="M-8,30 L-20,42 L-17,45 L-6,34 Z" fill="#f1f5f9"/>
    <path d="M12,30 L22,40 L19,43 L9,34 Z" fill="#f1f5f9"/>
    <!-- Helmet & Gold Visor -->
    <circle cx="2" cy="18" r="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="4" cy="18" rx="6" ry="5" fill="url(#goldFoil)" filter="url(#glow)"/>
  </g>

  <!-- Scientific Equipment (LRRR & PSEP) -->
  <g transform="translate(240, 340)">
    <polygon points="0,15 15,10 30,15 15,20" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="5" y="8" width="8" height="6" fill="#3b82f6"/>
    <rect x="17" y="8" width="8" height="6" fill="#3b82f6"/>
  </g>

  <!-- Header Banner & Title -->
  <rect x="0" y="0" width="800" height="70" fill="url(#spaceBg)" opacity="0.6"/>
  <text x="30" y="32" font-family="'Orbitron', sans-serif" font-weight="900" font-size="18" fill="#38bdf8" letter-spacing="2">
    ROTALI FENCİ • 3D VR SİMÜLASYONU
  </text>
  <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="1">
    AY'A İNİŞ – 3D KEŞİF VE VR DENEYİMİ
  </text>

  <!-- Badge Bottom Left -->
  <rect x="30" y="385" width="235" height="36" rx="18" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" opacity="0.9"/>
  <text x="50" y="408" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#38bdf8">
    🚀 Apollo 11 &amp; Dünya Gözlemi
  </text>

  <!-- Badge Bottom Right -->
  <rect x="635" y="385" width="135" height="36" rx="18" fill="#1e293b" stroke="#eab308" stroke-width="1.5" opacity="0.9"/>
  <text x="655" y="408" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#facc15">
    3D + WebXR VR
  </text>
</svg>
