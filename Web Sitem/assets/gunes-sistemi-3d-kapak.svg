<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep Cosmic Space Radial -->
    <radialGradient id="space-bg" cx="40%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="45%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Sun Glow -->
    <radialGradient id="sun-glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#space-bg)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="110" r="1.5" />
    <circle cx="170" cy="80" r="1.2" />
    <circle cx="290" cy="160" r="2" fill="#38bdf8" />
    <circle cx="430" cy="90" r="1.2" />
    <circle cx="560" cy="140" r="1.8" />
    <circle cx="700" cy="70" r="1.5" />
    <circle cx="820" cy="130" r="2" fill="#fde047" />
    <circle cx="940" cy="85" r="1" />
    <circle cx="1080" cy="140" r="2" />
    <circle cx="1150" cy="70" r="1.5" />
    <circle cx="120" cy="270" r="1" />
    <circle cx="240" cy="330" r="1.5" />
    <circle cx="1000" cy="290" r="1.2" />
    <circle cx="1130" cy="370" r="2" fill="#38bdf8" />
    <circle cx="880" cy="390" r="1" />
    <circle cx="750" cy="460" r="1.4" />
    <circle cx="920" cy="530" r="1.8" />
    <circle cx="1060" cy="580" r="1.2" />
  </g>

  <!-- Orbital Ellipses Center around Sun (x: 180, y: 315) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.32" stroke-dasharray="6 4">
    <!-- Mercury -->
    <ellipse cx="180" cy="315" rx="100" ry="80" />
    <!-- Venus -->
    <ellipse cx="180" cy="315" rx="160" ry="125" />
    <!-- Earth -->
    <ellipse cx="180" cy="315" rx="240" ry="180" stroke="#38bdf8" stroke-width="1.8" opacity="0.5" />
    <!-- Mars -->
    <ellipse cx="180" cy="315" rx="330" ry="240" />
    <!-- Asteroid belt dotted band -->
    <ellipse cx="180" cy="315" rx="420" ry="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 8" opacity="0.4" />
    <!-- Jupiter -->
    <ellipse cx="180" cy="315" rx="540" ry="360" />
    <!-- Saturn -->
    <ellipse cx="180" cy="315" rx="680" ry="430" />
    <!-- Uranus -->
    <ellipse cx="180" cy="315" rx="820" ry="500" />
    <!-- Neptune -->
    <ellipse cx="180" cy="315" rx="970" ry="570" />
  </g>

  <!-- Central Blazing Sun -->
  <g transform="translate(180, 315)">
    <circle cx="0" cy="0" r="140" fill="url(#sun-corona)" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="75" fill="url(#sun-glow)" filter="url(#glow-gold)" />
    <!-- Sunspots -->
    <ellipse cx="-20" cy="-10" rx="6" ry="4" fill="#451a03" opacity="0.75" />
    <ellipse cx="15" cy="18" rx="8" ry="5" fill="#451a03" opacity="0.8" />
  </g>

  <!-- Planets positioned along their orbits -->
  <!-- 1. Mercury (x: 275, y: 285) -->
  <g transform="translate(275, 285)">
    <circle cx="0" cy="0" r="9" fill="#9ca3af" />
    <circle cx="-2" cy="-2" r="3" fill="#cbd5e1" opacity="0.6" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Merkür</text>
  </g>

  <!-- 2. Venus (x: 320, y: 245) -->
  <g transform="translate(325, 235)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" />
    <circle cx="-3" cy="-3" r="5" fill="#fef08a" opacity="0.7" />
    <text x="0" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#fde047" text-anchor="middle">Venüs</text>
  </g>

  <!-- 3. Earth & Moon (x: 400, y: 210) -->
  <g transform="translate(400, 200)">
    <!-- Atmosphere glow -->
    <circle cx="0" cy="0" r="20" fill="#38bdf8" opacity="0.3" filter="url(#glow-blue)" />
    <!-- Earth sphere -->
    <circle cx="0" cy="0" r="17" fill="#1d4ed8" />
    <path d="M -8 -8 Q -2 -12 6 -6 Q 10 2 6 8 Q -4 10 -8 4 Z" fill="#22c55e" opacity="0.8" />
    <!-- Moon -->
    <circle cx="26" cy="-8" r="4.5" fill="#e2e8f0" />
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Dünya</text>
  </g>

  <!-- 4. Mars (x: 485, y: 175) -->
  <g transform="translate(485, 175)">
    <circle cx="0" cy="0" r="12" fill="#ea580c" />
    <circle cx="-2" cy="-3" r="4" fill="#fca5a5" opacity="0.6" />
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">Mars</text>
  </g>

  <!-- 5. Jupiter (x: 640, y: 195) -->
  <g transform="translate(640, 195)">
    <circle cx="0" cy="0" r="38" fill="#c2410c" />
    <!-- Cloud Bands -->
    <clipPath id="jupiter-clip">
      <circle cx="0" cy="0" r="38" />
    </clipPath>
    <g clip-path="url(#jupiter-clip)">
      <rect x="-40" y="-30" width="80" height="12" fill="#fed7aa" />
      <rect x="-40" y="-10" width="80" height="14" fill="#ea580c" />
      <rect x="-40" y="10" width="80" height="12" fill="#fed7aa" />
      <!-- Great Red Spot -->
      <ellipse cx="14" cy="12" rx="10" ry="6" fill="#991b1b" />
    </g>
    <text x="0" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fed7aa" text-anchor="middle">Jüpiter</text>
  </g>

  <!-- 6. Saturn with 3D Rings (x: 800, y: 240) -->
  <g transform="translate(800, 240)">
    <!-- Ring Back -->
    <ellipse cx="0" cy="0" rx="60" ry="16" fill="none" stroke="#fcd34d" stroke-width="9" opacity="0.8" transform="rotate(-18)" />
    <!-- Saturn Body -->
    <circle cx="0" cy="0" r="30" fill="#eab308" />
    <ellipse cx="-4" cy="-4" rx="20" ry="8" fill="#fef08a" opacity="0.4" />
    <!-- Ring Front Overlay -->
    <path d="M -56 18 A 60 16 0 0 0 56 -18" fill="none" stroke="#fcd34d" stroke-width="9" opacity="0.9" transform="rotate(-18)" />
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">Satürn</text>
  </g>

  <!-- 7. Uranus (x: 940, y: 310) -->
  <g transform="translate(940, 310)">
    <circle cx="0" cy="0" r="22" fill="#06b6d4" />
    <ellipse cx="0" cy="0" rx="30" ry="7" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.6" transform="rotate(80)" />
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle">Uranüs</text>
  </g>

  <!-- 8. Neptune (x: 1060, y: 400) -->
  <g transform="translate(1060, 400)">
    <circle cx="0" cy="0" r="21" fill="#2563eb" />
    <circle cx="-4" cy="-4" r="8" fill="#60a5fa" opacity="0.6" />
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">Neptün</text>
  </g>

  <!-- TOP-LEFT HEADER & TYPOGRAPHY -->
  <g transform="translate(50, 75)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-blue)" />
    <text x="35" y="22" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc" letter-spacing="2">
      6. SINIF FEN BİLİMLERİ 1. ÜNİTE
    </text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Orbitron', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="2" filter="url(#glow-blue)">
      GÜNEŞ SİSTEMİ
    </text>

    <!-- Subtitle -->
    <text x="2" y="125" font-family="'Orbitron', sans-serif" font-size="24" font-weight="700" fill="#facc15" letter-spacing="3">
      3D KEŞİF LABORATUVARI
    </text>

    <!-- Badges -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="165" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">🪐 8 Gezegen &amp; Güneş</text>

      <rect x="175" y="0" width="150" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="187" y="19" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">🌍 Dünya &amp; Ay Modu</text>

      <rect x="335" y="0" width="150" height="28" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="347" y="19" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#fde047">🎮 5 Uzay Görevi</text>
    </g>
  </g>

  <!-- BOTTOM PLATFORM BRANDING -->
  <g transform="translate(50, 580)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">
      ROTALI FENCİ EĞİTİM PLATFORMU
    </text>
  </g>

  <g transform="translate(1010, 580)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">
      @rotalifenci
    </text>
  </g>
</svg>
